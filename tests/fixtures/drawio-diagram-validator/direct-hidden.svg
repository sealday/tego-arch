<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
  role="img" aria-labelledby="title desc">
  <title id="title">Direct hidden labels</title>
  <desc id="desc">Every required text node is directly hidden.</desc>
  <text display="none">Direct display</text>
  <text style="visibility: hidden">Direct visibility</text>
  <text opacity="0">Direct opacity</text>
  <text style="fill-opacity: 0">Direct fill opacity</text>
  <text aria-hidden="true">Direct aria</text>
</svg>
