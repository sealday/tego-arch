<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="agt-p-06-title agt-p-06-desc" data-drawio-sha256="19058c263aaa3cc4065933df6893346d77912ec397b97322c09d69f97e758dde">
  <title id="agt-p-06-title">Supervisor, Handoff, and Agent-as-Tool control ownership models</title>
  <desc id="agt-p-06-desc">Three separated regions compare a supervisor that delegates and receives results while retaining control, a handoff that moves the active conversation to another agent, and a parent agent that calls an agent as a bounded tool and receives the result.</desc>
  <g transform="translate(19 29)"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: var(--ge-adaptive-bg, #ffffff);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="6bOi_dQNtrXvTcmtraYe-1"><g transform="translate(0.5,0.5)"><rect data-region-id="supervisor-region" x="1" y="1" width="360" height="650" rx="54" ry="54" fill="#f7f4ff" stroke="#7654a6" stroke-width="3" stroke-dasharray="9 9" pointer-events="all" style="fill: light-dark(rgb(247, 244, 255), rgb(27, 25, 34)); stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-2"><g transform="translate(0.5,0.5)"><rect data-region-id="handoff-region" x="401" y="1" width="360" height="650" rx="54" ry="54" fill="#fff8ea" stroke="#a95d13" stroke-width="3" stroke-dasharray="9 9" pointer-events="all" style="fill: light-dark(rgb(255, 248, 234), rgb(29, 23, 11)); stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-3"><g transform="translate(0.5,0.5)"><rect data-region-id="tool-region" x="801" y="1" width="360" height="650" rx="54" ry="54" fill="#eef8f2" stroke="#2e7d5b" stroke-width="3" stroke-dasharray="9 9" pointer-events="all" style="fill: light-dark(rgb(238, 248, 242), rgb(20, 28, 23)); stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-4"><g transform="translate(0.5,0.5)"><rect data-node-id="supervisor" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="41" y="121" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#7654a6" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-5"><g><rect x="65" y="179" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5C4778" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(92, 71, 120), rgb(180, 162, 204));"><text data-type-for="supervisor" data-bottom-clearance-css="20" text-anchor="middle" font-size="18" textLength="126" lengthAdjust="spacingAndGlyphs" x="181" y="201">全局控制与停止</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-6"><g transform="translate(0.5,0.5)"><rect data-node-id="worker" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="41" y="411" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#52616b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-7"><g><rect x="65" y="469" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52616B" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"><text data-type-for="worker" data-bottom-clearance-css="20" text-anchor="middle" font-size="18" textLength="90" lengthAdjust="spacingAndGlyphs" x="181" y="491">受限子任务</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-8"><g transform="translate(0.5,0.5)"><rect data-node-id="handoff" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="441" y="121" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#a95d13" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-9"><g><rect x="465" y="179" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#704318" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(112, 67, 24), rgb(208, 169, 132));"><text data-type-for="handoff" data-bottom-clearance-css="20" text-anchor="middle" font-size="18" textLength="108" lengthAdjust="spacingAndGlyphs" x="581" y="201">原会话所有者</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-10"><g transform="translate(0.5,0.5)"><rect data-node-id="active-agent" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="441" y="411" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#52616b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-11"><g><rect x="465" y="469" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52616B" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"><text data-type-for="active-agent" data-bottom-clearance-css="20" text-anchor="middle" font-size="18" textLength="108" lengthAdjust="spacingAndGlyphs" x="581" y="491">新会话所有者</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-12"><g transform="translate(0.5,0.5)"><rect data-node-id="parent-agent" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="841" y="121" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#2e7d5b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-13"><g><rect x="865" y="179" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#365B49" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(54, 91, 73), rgb(143, 175, 160));"><text data-type-for="parent-agent" data-bottom-clearance-css="20" text-anchor="middle" font-size="18" textLength="126" lengthAdjust="spacingAndGlyphs" x="981" y="201">保留任务与会话</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-14"><g transform="translate(0.5,0.5)"><rect data-node-id="agent-as-tool" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="841" y="411" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#52616b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-15"><g><rect x="865" y="469" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52616B" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"><text data-type-for="agent-as-tool" data-bottom-clearance-css="20" text-anchor="middle" font-size="18" textLength="108" lengthAdjust="spacingAndGlyphs" x="981" y="491">有界专家调用</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-16" data-edge-group-id="edge-supervisor-delegate"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-supervisor-delegate" data-source="supervisor" data-target="worker" d="M 69 231 L 69 398.65" fill="none" stroke="#7654a6" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/><path d="M 69 407.65 L 64.5 398.65 L 73.5 398.65 Z" fill="#7654a6" stroke="#7654a6" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(118, 84, 166), rgb(171, 142, 213)); stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/></g><g><g fill="#34204D" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(52, 32, 77), rgb(215, 197, 236));"><rect fill="#F7F4FF" stroke="none" x="93" y="272" width="98" height="30" stroke-width="0" style="fill: light-dark(rgb(247, 244, 255), rgb(27, 25, 34));"/><text data-edge-label-for="edge-supervisor-delegate" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" text-anchor="middle" font-size="24" textLength="90" lengthAdjust="spacingAndGlyphs" x="141" y="297">反复委派</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-17" data-edge-group-id="edge-worker-return"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-worker-return" data-source="worker" data-target="supervisor" d="M 293 411 L 293 243.35" fill="none" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" stroke-dasharray="9 9" pointer-events="stroke" style="stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/><path d="M 293 234.35 L 297.5 243.35 L 288.5 243.35 Z" fill="#52616b" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g fill="#1F2A30" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(31, 42, 48), rgb(195, 204, 209));"><rect fill="#F7F4FF" stroke="none" x="97" y="342" width="170" height="30" stroke-width="0" style="fill: light-dark(rgb(247, 244, 255), rgb(27, 25, 34));"/><text data-edge-label-for="edge-worker-return" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" text-anchor="middle" font-size="24" textLength="162" lengthAdjust="spacingAndGlyphs" x="181" y="367">结构化结果返回</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-18" data-edge-group-id="edge-handoff-move"><g><path data-edge-id="edge-handoff-move" data-source="handoff" data-target="active-agent" d="M 455 231 L 455 396.53" fill="none" stroke="#a95d13" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/><path d="M 455 406.53 L 450 396.53 L 460 396.53 Z" fill="#a95d13" stroke="#a95d13" stroke-width="4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(169, 93, 19), rgb(204, 139, 75)); stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/></g><g><g fill="#53300A" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(83, 48, 10), rgb(218, 188, 155));"><rect fill="#FFF8EA" stroke="none" x="480" y="307" width="242" height="30" stroke-width="0" style="fill: light-dark(rgb(255, 248, 234), rgb(29, 23, 11));"/><text data-edge-label-for="edge-handoff-move" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" text-anchor="middle" font-size="24" textLength="234" lengthAdjust="spacingAndGlyphs" x="600" y="332">当前会话与控制权移动</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-19" data-edge-group-id="edge-parent-call"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-parent-call" data-source="parent-agent" data-target="agent-as-tool" d="M 869 231 L 869 398.65" fill="none" stroke="#2e7d5b" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/><path d="M 869 407.65 L 864.5 398.65 L 873.5 398.65 Z" fill="#2e7d5b" stroke="#2e7d5b" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(46, 125, 91), rgb(95, 163, 134)); stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/></g><g><g fill="#173D2D" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(23, 61, 45), rgb(168, 200, 187));"><rect fill="#EEF8F2" stroke="none" x="887" y="272" width="170" height="30" stroke-width="0" style="fill: light-dark(rgb(238, 248, 242), rgb(20, 28, 23));"/><text data-edge-label-for="edge-parent-call" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" text-anchor="middle" font-size="24" textLength="162" lengthAdjust="spacingAndGlyphs" x="971" y="297">调用有界子任务</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-20" data-edge-group-id="edge-tool-return"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-tool-return" data-source="agent-as-tool" data-target="parent-agent" d="M 1093 411 L 1093 243.35" fill="none" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" stroke-dasharray="9 9" pointer-events="stroke" style="stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/><path d="M 1093 234.35 L 1097.5 243.35 L 1088.5 243.35 Z" fill="#52616b" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g fill="#1F2A30" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(31, 42, 48), rgb(195, 204, 209));"><rect fill="#EEF8F2" stroke="none" x="894" y="342" width="175" height="30" stroke-width="0" style="fill: light-dark(rgb(238, 248, 242), rgb(20, 28, 23));"/><text data-edge-label-for="edge-tool-return" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" text-anchor="middle" font-size="24" textLength="168" lengthAdjust="spacingAndGlyphs" x="981" y="367">结果返回 Parent</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-21"><g><rect x="41" y="571" width="280" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5C4778" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(92, 71, 120), rgb(180, 162, 204));"><text x="181" y="593">控制不移动 · 结果返回</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-22"><g><rect x="441" y="571" width="280" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#704318" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(112, 67, 24), rgb(208, 169, 132));"><text x="581" y="593">控制移动 · 不自动返回</text></g></g></g><g data-cell-id="6bOi_dQNtrXvTcmtraYe-23"><g><rect x="841" y="571" width="280" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#365B49" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(54, 91, 73), rgb(143, 175, 160));"><text x="981" y="593">控制不移动 · 子结果返回</text></g></g></g></g></g></g></g>

