name: Check external source links

on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check live links
        run: npm run check:links:live -- --output /tmp/source-link-health-live.json
      - name: Upload live link report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-link-health-live
          path: /tmp/source-link-health-live.json
          if-no-files-found: error
      - name: Build content review report
        if: always()
        run: npm run report:reviews -- --as-of "$(date -u +%F)" --json /tmp/content-review-health.json --markdown /tmp/content-review-health.md
      - name: Upload content review report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-review-health
          path: |
            /tmp/content-review-health.json
            /tmp/content-review-health.md
          if-no-files-found: error
