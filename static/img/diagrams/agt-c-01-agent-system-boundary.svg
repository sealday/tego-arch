<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="agt-c-01-title agt-c-01-desc">
  <title id="agt-c-01-title">Agent system boundary reference architecture</title>
  <desc id="agt-c-01-desc">User or event enters policy and routing. The Agent Harness contains and governs the Agent Loop, which may retrieve knowledge, invoke sandboxed tools, or ask humans and other agents. State, memory, checkpoint, tracing, evaluation, and guardrails form a cross-cutting foundation.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#3568A8"/></marker>
    <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#A95D13"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#7654A6"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#2E7D5B"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>
  <path d="M230 105 H290" fill="none" stroke="#3568A8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M430 165 V220 H330 V260" fill="none" stroke="#A95D13" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M770 165 V220 H760 V260" fill="none" stroke="#A95D13" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M1065 165 V220 H1000 V260" fill="none" stroke="#A95D13" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <g><rect data-node-id="user" x="20" y="45" width="210" height="120" rx="16" fill="#E8F1FF" stroke="#3568A8" stroke-width="3"/><text x="125" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#17324D">User / Event</text><text x="125" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#36546B">interaction input</text></g>
  <g><rect data-node-id="policy" x="290" y="45" width="280" height="120" rx="16" fill="#FFF4E5" stroke="#A95D13" stroke-width="3"/><text x="430" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#53300A">Policy &amp; Routing</text><text x="430" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#704318">entry control</text></g>
  <g><rect data-node-id="budget" x="620" y="45" width="300" height="120" rx="16" fill="#FFF8EA" stroke="#A95D13" stroke-width="3"/><text x="770" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#53300A">Budget &amp; Termination</text><text x="770" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#704318">bounded execution</text></g>
  <g><rect data-node-id="approval" x="950" y="45" width="230" height="120" rx="16" fill="#FFF8EA" stroke="#A95D13" stroke-width="3"/><text x="1065" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#53300A">Human Approval</text><text x="1065" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#704318">risk gate</text></g>

  <g><rect data-node-id="harness" x="120" y="260" width="960" height="430" rx="22" fill="#F4EDFF" stroke="#7654A6" stroke-width="4"/><text x="150" y="305" text-anchor="start" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#34204D">Agent Harness</text><text x="150" y="341" text-anchor="start" font-family="system-ui, sans-serif" font-size="18" fill="#5C4778">contains &amp; governs Agent Loop · runtime, context, permissions, budget, recovery, evaluation hooks</text></g>
  <g><rect data-node-id="loop" x="250" y="360" width="700" height="160" rx="18" fill="#FFFFFF" stroke="#4D6475" stroke-width="3"/><text x="280" y="404" text-anchor="start" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#1F2A30">Agent Loop</text><text x="280" y="440" text-anchor="start" font-family="system-ui, sans-serif" font-size="18" fill="#52616B">model-selected next action within harness limits</text><text x="600" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#1F2A30">Plan → Act → Observe → Evaluate → Terminate</text></g>
  <path data-edge-id="edge-loop-knowledge" data-source="loop" data-target="knowledge" d="M280 520 V550" fill="none" stroke="#2E7D5B" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path data-edge-id="edge-loop-tools" data-source="loop" data-target="tools" d="M600 520 V550" fill="none" stroke="#2E7D5B" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path data-edge-id="edge-loop-human" data-source="loop" data-target="human-agents" d="M920 520 V550" fill="none" stroke="#2E7D5B" stroke-width="3" marker-end="url(#arrow-green)"/>
  <g><rect data-node-id="knowledge" x="130" y="550" width="300" height="110" rx="14" fill="#EAF7F0" stroke="#2E7D5B" stroke-width="3"/><text x="280" y="594" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#173D2D">Knowledge / Retrieval</text><text x="280" y="630" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#365B49">evidence access</text></g>
  <g><rect data-node-id="tools" x="450" y="550" width="300" height="110" rx="14" fill="#EAF7F0" stroke="#2E7D5B" stroke-width="3"/><text x="600" y="594" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#173D2D">Tools / Sandbox</text><text x="600" y="630" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#365B49">bounded effects</text></g>
  <g><rect data-node-id="human-agents" x="770" y="550" width="300" height="110" rx="14" fill="#EAF7F0" stroke="#2E7D5B" stroke-width="3"/><text x="920" y="594" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#173D2D">Human / Other Agents</text><text x="920" y="630" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#365B49">approval or delegation</text></g>

  <g><rect data-node-id="foundation" x="80" y="720" width="1040" height="160" rx="18" fill="#F0F3F5" stroke="#52616B" stroke-width="3"/><text x="110" y="757" text-anchor="start" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1F2A30">Cross-cutting foundation</text></g>
  <g><rect data-node-id="state" x="100" y="780" width="130" height="70" rx="12" fill="#FFFFFF" stroke="#52616B" stroke-width="2"/><text x="165" y="823" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2A30">State</text></g>
  <g><rect data-node-id="memory" x="260" y="780" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#52616B" stroke-width="2"/><text x="335" y="823" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2A30">Memory</text></g>
  <g><rect data-node-id="checkpoint" x="440" y="780" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#52616B" stroke-width="2"/><text x="530" y="823" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2A30">Checkpoint</text></g>
  <g><rect data-node-id="trace" x="650" y="780" width="450" height="70" rx="12" fill="#FFFFFF" stroke="#52616B" stroke-width="2"/><text x="875" y="823" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2A30">Trace / Evaluation / Guardrail</text></g>
</svg>
