<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="agt-p-06-title agt-p-06-desc">
  <title id="agt-p-06-title">Supervisor, Handoff, and Agent-as-Tool control ownership models</title>
  <desc id="agt-p-06-desc">Three separated regions compare a supervisor that delegates and receives results while retaining control, a handoff that moves the active conversation to another agent, and a parent agent that calls an agent as a bounded tool and receives the result.</desc>
  <g transform="translate(19 29)"><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: var(--ge-adaptive-bg, #ffffff);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="supervisor-region"><g transform="translate(0.5,0.5)"><rect data-region-id="supervisor-region" x="1.35" y="1.5" width="360" height="650" rx="54" ry="54" fill="#f7f4ff" stroke="#7654a6" stroke-width="3" stroke-dasharray="9 9" pointer-events="all" style="fill: light-dark(rgb(247, 244, 255), rgb(27, 25, 34)); stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/></g><g><g></g></g></g><g data-cell-id="handoff-region"><g transform="translate(0.5,0.5)"><rect data-region-id="handoff-region" x="401.35" y="1.5" width="360" height="650" rx="54" ry="54" fill="#fff8ea" stroke="#a95d13" stroke-width="3" stroke-dasharray="9 9" pointer-events="all" style="fill: light-dark(rgb(255, 248, 234), rgb(29, 23, 11)); stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/></g><g><g></g></g></g><g data-cell-id="tool-region"><g transform="translate(0.5,0.5)"><rect data-region-id="tool-region" x="801.35" y="1.5" width="360" height="650" rx="54" ry="54" fill="#eef8f2" stroke="#2e7d5b" stroke-width="3" stroke-dasharray="9 9" pointer-events="all" style="fill: light-dark(rgb(238, 248, 242), rgb(20, 28, 23)); stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/></g><g><g></g></g></g><g data-cell-id="supervisor"><g transform="translate(0.5,0.5)"><rect data-node-id="supervisor" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="41.35" y="121.5" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#7654a6" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/></g><g><g></g></g></g><g data-cell-id="supervisor-type"><g><rect x="65.35" y="179.5" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5C4778" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(92, 71, 120), rgb(180, 162, 204));"><text data-type-for="supervisor" data-bottom-clearance-css="20" x="181.35" y="201.5">全局控制与停止</text></g></g></g><g data-cell-id="worker"><g transform="translate(0.5,0.5)"><rect data-node-id="worker" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="41.35" y="411.5" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#52616b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g></g></g></g><g data-cell-id="worker-type"><g><rect x="65.35" y="469.5" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52616B" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"><text data-type-for="worker" data-bottom-clearance-css="20" x="181.35" y="491.5">受限子任务</text></g></g></g><g data-cell-id="handoff"><g transform="translate(0.5,0.5)"><rect data-node-id="handoff" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="441.35" y="121.5" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#a95d13" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/></g><g><g></g></g></g><g data-cell-id="handoff-type"><g><rect x="465.35" y="179.5" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#704318" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(112, 67, 24), rgb(208, 169, 132));"><text data-type-for="handoff" data-bottom-clearance-css="20" x="581.35" y="201.5">原会话所有者</text></g></g></g><g data-cell-id="active-agent"><g transform="translate(0.5,0.5)"><rect data-node-id="active-agent" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="441.35" y="411.5" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#52616b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g></g></g></g><g data-cell-id="active-agent-type"><g><rect x="465.35" y="469.5" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52616B" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"><text data-type-for="active-agent" data-bottom-clearance-css="20" x="581.35" y="491.5">新会话所有者</text></g></g></g><g data-cell-id="parent-agent"><g transform="translate(0.5,0.5)"><rect data-node-id="parent-agent" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="841.35" y="121.5" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#2e7d5b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/></g><g><g></g></g></g><g data-cell-id="parent-agent-type"><g><rect x="865.35" y="179.5" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#365B49" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(54, 91, 73), rgb(143, 175, 160));"><text data-type-for="parent-agent" data-bottom-clearance-css="20" x="981.35" y="201.5">保留任务与会话</text></g></g></g><g data-cell-id="agent-as-tool"><g transform="translate(0.5,0.5)"><rect data-node-id="agent-as-tool" data-padding-horizontal-css="16" data-padding-vertical-css="14" x="841.35" y="411.5" width="280" height="110" rx="16.5" ry="16.5" fill="#ffffff" stroke="#52616b" stroke-width="3" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g></g></g></g><g data-cell-id="agent-as-tool-type"><g><rect x="865.35" y="469.5" width="232" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#52616B" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"><text data-type-for="agent-as-tool" data-bottom-clearance-css="20" x="981.35" y="491.5">有界专家调用</text></g></g></g><g data-cell-id="edge-supervisor-delegate"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-supervisor-delegate" data-source="supervisor" data-target="worker" d="M 69.35 231.5 L 69.35 399.15" fill="none" stroke="#7654a6" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/><path d="M 69.35 408.15 L 64.85 399.15 L 73.85 399.15 Z" fill="#7654a6" stroke="#7654a6" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(118, 84, 166), rgb(171, 142, 213)); stroke: light-dark(rgb(118, 84, 166), rgb(171, 142, 213));"/></g><g><g fill="#34204D" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(52, 32, 77), rgb(215, 197, 236));"><rect fill="#F7F4FF" stroke="none" x="93" y="273" width="98" height="30" stroke-width="0" style="fill: light-dark(rgb(247, 244, 255), rgb(27, 25, 34));"/><text data-edge-label-for="edge-supervisor-delegate" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" x="141.35" y="298.27">反复委派</text></g></g></g><g data-cell-id="edge-worker-return"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-worker-return" data-source="worker" data-target="supervisor" d="M 293.35 411.5 L 293.35 243.85" fill="none" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" stroke-dasharray="9 9" pointer-events="stroke" style="stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/><path d="M 293.35 234.85 L 297.85 243.85 L 288.85 243.85 Z" fill="#52616b" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g fill="#1F2A30" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(31, 42, 48), rgb(195, 204, 209));"><rect fill="#F7F4FF" stroke="none" x="97" y="342" width="170" height="30" stroke-width="0" style="fill: light-dark(rgb(247, 244, 255), rgb(27, 25, 34));"/><text data-edge-label-for="edge-worker-return" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" x="181.35" y="366.73">结构化结果返回</text></g></g></g><g data-cell-id="edge-handoff-move"><g><path data-edge-id="edge-handoff-move" data-source="handoff" data-target="active-agent" d="M 455.35 231.5 L 455.35 397.03" fill="none" stroke="#a95d13" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/><path d="M 455.35 407.03 L 450.35 397.03 L 460.35 397.03 Z" fill="#a95d13" stroke="#a95d13" stroke-width="4" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(169, 93, 19), rgb(204, 139, 75)); stroke: light-dark(rgb(169, 93, 19), rgb(204, 139, 75));"/></g><g><g fill="#53300A" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(83, 48, 10), rgb(218, 188, 155));"><rect fill="#FFF8EA" stroke="none" x="480" y="308" width="242" height="30" stroke-width="0" style="fill: light-dark(rgb(255, 248, 234), rgb(29, 23, 11));"/><text data-edge-label-for="edge-handoff-move" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" x="600.35" y="333.27">当前会话与控制权移动</text></g></g></g><g data-cell-id="edge-parent-call"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-parent-call" data-source="parent-agent" data-target="agent-as-tool" d="M 869.35 231.5 L 869.35 399.15" fill="none" stroke="#2e7d5b" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/><path d="M 869.35 408.15 L 864.85 399.15 L 873.85 399.15 Z" fill="#2e7d5b" stroke="#2e7d5b" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(46, 125, 91), rgb(95, 163, 134)); stroke: light-dark(rgb(46, 125, 91), rgb(95, 163, 134));"/></g><g><g fill="#173D2D" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(23, 61, 45), rgb(168, 200, 187));"><rect fill="#EEF8F2" stroke="none" x="887" y="273" width="170" height="30" stroke-width="0" style="fill: light-dark(rgb(238, 248, 242), rgb(20, 28, 23));"/><text data-edge-label-for="edge-parent-call" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" x="971.35" y="298.27">调用有界子任务</text></g></g></g><g data-cell-id="edge-tool-return"><g transform="translate(0.5,0.5)"><path data-edge-id="edge-tool-return" data-source="agent-as-tool" data-target="parent-agent" d="M 1093.35 411.5 L 1093.35 243.85" fill="none" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" stroke-dasharray="9 9" pointer-events="stroke" style="stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/><path d="M 1093.35 234.85 L 1097.85 243.85 L 1088.85 243.85 Z" fill="#52616b" stroke="#52616b" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(82, 97, 107), rgb(145, 158, 167)); stroke: light-dark(rgb(82, 97, 107), rgb(145, 158, 167));"/></g><g><g fill="#1F2A30" font-family="Helvetica" text-anchor="middle" font-size="24px" style="fill: light-dark(rgb(31, 42, 48), rgb(195, 204, 209));"><rect fill="#EEF8F2" stroke="none" x="894" y="342" width="175" height="30" stroke-width="0" style="fill: light-dark(rgb(238, 248, 242), rgb(20, 28, 23));"/><text data-edge-label-for="edge-tool-return" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12" x="981.35" y="366.73">结果返回 Parent</text></g></g></g><g data-cell-id="supervisor-note"><g><rect x="41.35" y="571.5" width="280" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#5C4778" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(92, 71, 120), rgb(180, 162, 204));"><text x="181.35" y="593.5">控制不移动 · 结果返回</text></g></g></g><g data-cell-id="handoff-note"><g><rect x="441.35" y="571.5" width="280" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#704318" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(112, 67, 24), rgb(208, 169, 132));"><text x="581.35" y="593.5">控制移动 · 不自动返回</text></g></g></g><g data-cell-id="tool-note"><g><rect x="841.35" y="571.5" width="280" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#365B49" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(54, 91, 73), rgb(143, 175, 160));"><text x="981.35" y="593.5">控制不移动 · 子结果返回</text></g></g></g></g></g></g></g>

