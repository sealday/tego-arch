<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1800" role="img" aria-labelledby="sty06-title sty06-desc">
  <title id="sty06-title">事件驱动的四种模式：事件通知、状态转移、事件携带状态与事件溯源</title>
  <desc id="sty06-desc">以同一订单、支付与通知语境比较事件通知、状态转移、事件携带状态、事件溯源的载荷、回查、权威状态与恢复边界。回放只重建聚合和读取投影，不触发支付扣款或重复通知。</desc>
  <defs>
    <marker id="arrow-command" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B21A8"/></marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1D4ED8"/></marker>
    <marker id="arrow-lookup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/></marker>
    <marker id="arrow-replay" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 6 L 6 1 L 11 6 L 6 11 Z" fill="#FEF3C7" stroke="#92400E" stroke-width="1.5"/></marker>
  </defs>
  <style>
    .boundary { fill: none; stroke: #64748B; stroke-width: 3; stroke-dasharray: 12 8; }
    .column { stroke-width: 4; }
    .node-shape { fill: #FFFFFF; stroke-width: 4; }
    .authority-shape { fill: #EDE9FE; stroke: #6B21A8; }
    .node-label { fill: #111827; font-family: system-ui, sans-serif; font-size: 45px; font-weight: 700; text-anchor: middle; }
    .small-label { fill: #111827; font-family: system-ui, sans-serif; font-size: 45px; font-weight: 700; text-anchor: middle; }
    .column-label { fill: #111827; font-family: system-ui, sans-serif; font-size: 54px; font-weight: 700; text-anchor: middle; }
    .row-label { fill: #111827; font-family: system-ui, sans-serif; font-size: 45px; font-weight: 700; }
    .command-edge { fill: none; stroke: #6B21A8; stroke-width: 7; marker-end: url(#arrow-command); }
    .event-delivery-edge { fill: none; stroke: #1D4ED8; stroke-width: 7; stroke-dasharray: 22 14; marker-end: url(#arrow-event); }
    .sync-lookup-edge { fill: none; stroke: #0F766E; stroke-width: 7; marker-end: url(#arrow-lookup); }
    .replay-edge { fill: none; stroke: #92400E; stroke-width: 7; stroke-dasharray: 5 15; marker-end: url(#arrow-replay); }
    .edge-label { fill: #111827; font-family: system-ui, sans-serif; font-size: 45px; font-weight: 700; text-anchor: middle; }
    .legend-label { fill: #111827; font-family: system-ui, sans-serif; font-size: 45px; font-weight: 700; }
    .note { fill: #7F1D1D; font-family: system-ui, sans-serif; font-size: 45px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect x="0" y="0" width="2400" height="1800" fill="#F8FAFC"/>

  <g data-node-id="canvas" data-node-bounds="20 20 2360 1760"><rect x="20" y="20" width="2360" height="1760" rx="12" fill="none" stroke="#334155" stroke-width="4"/><text class="node-label" x="1200" y="65">事件驱动的四种模式不是成熟度阶梯</text></g>
  <g data-node-id="notification-column" data-node-bounds="240 80 510 1340"><rect class="column" data-edge-label-background="notification-column" x="240" y="80" width="510" height="1340" rx="18" fill="#EFF6FF" stroke="#2563EB"/><text class="column-label" x="495" y="145">事件通知</text></g>
  <g data-node-id="transition-column" data-node-bounds="770 80 510 1340"><rect class="column" x="770" y="80" width="510" height="1340" rx="18" fill="#F0FDF4" stroke="#15803D"/><text class="column-label" x="1025" y="145">状态转移</text></g>
  <g data-node-id="carried-state-column" data-node-bounds="1300 80 510 1340"><rect class="column" x="1300" y="80" width="510" height="1340" rx="18" fill="#FFF7ED" stroke="#C2410C"/><text class="column-label" x="1555" y="145">事件携带状态</text></g>
  <g data-node-id="event-sourcing-column" data-node-bounds="1830 80 510 1340"><rect class="column" x="1830" y="80" width="510" height="1340" rx="18" fill="#FAF5FF" stroke="#7E22CE"/><text class="column-label" x="2085" y="145">事件溯源</text></g>
  <g data-node-id="producer-write-row" data-node-bounds="240 180 2100 230"><rect class="boundary" x="240" y="180" width="2100" height="230"/><text class="row-label" x="255" y="220">生产者写入</text></g>
  <g data-node-id="event-payload-row" data-node-bounds="240 430 2100 230"><rect class="boundary" x="240" y="430" width="2100" height="230"/><text class="row-label" x="255" y="470">事件载荷</text></g>
  <g data-node-id="consumer-read-row" data-node-bounds="240 680 2100 230"><rect class="boundary" x="240" y="680" width="2100" height="230"/><text class="row-label" x="255" y="720">消费者读取</text></g>
  <g data-node-id="authority-row" data-node-bounds="240 930 2100 230"><rect class="boundary" x="240" y="930" width="2100" height="230"/><text class="row-label" x="255" y="970">权威状态</text></g>
  <g data-node-id="recovery-row" data-node-bounds="240 1180 2100 230"><rect class="boundary" x="240" y="1180" width="2100" height="230"/><text class="row-label" x="255" y="1220">恢复 / 重建</text></g>

  <g data-node-id="notification-authority" data-node-bounds="300 275 190 80"><rect class="node-shape authority-shape" x="300" y="275" width="190" height="80" rx="14"/><text class="small-label" x="395" y="325">订单权威</text></g>
  <g data-node-id="notification-event" data-node-bounds="300 500 190 90"><rect class="node-shape" x="300" y="500" width="190" height="90" rx="14" stroke="#1D4ED8"/><text class="small-label" x="395" y="540">OrderSubmitted</text><text class="small-label" x="395" y="582">最小载荷</text></g>
  <g data-node-id="notification-broker" data-node-bounds="510 500 170 90"><rect class="node-shape" x="510" y="500" width="170" height="90" rx="14" stroke="#1D4ED8"/><text class="small-label" x="595" y="557">事件代理</text></g>
  <g data-node-id="notification-consumer" data-node-bounds="300 745 170 80"><rect class="node-shape" x="300" y="745" width="170" height="80" rx="14" stroke="#1D4ED8"/><text class="small-label" x="385" y="795">通知消费者</text></g>
  <g data-node-id="notification-lookup" data-node-bounds="500 745 190 80"><rect class="node-shape" x="500" y="745" width="190" height="80" rx="14" stroke="#1D4ED8"/><text class="small-label" x="595" y="780">同步回查</text><text class="small-label" x="595" y="814">订单服务</text></g>
  <g data-node-id="notification-recovery" data-node-bounds="330 1260 330 80"><rect class="node-shape" x="330" y="1260" width="330" height="80" rx="14" stroke="#1D4ED8"/><text class="small-label" x="495" y="1310">补偿扫描</text></g>
  <g data-node-id="order-transition" data-node-bounds="850 275 330 80"><rect class="node-shape authority-shape" x="850" y="275" width="330" height="80" rx="14" stroke="#15803D"/><text class="node-label" x="1015" y="325">订单状态变更</text></g>
  <g data-node-id="transition-event" data-node-bounds="835 500 360 90"><rect class="node-shape" x="835" y="500" width="360" height="90" rx="14" stroke="#15803D"/><text class="small-label" x="1015" y="540">from / to / reason</text><text class="small-label" x="1015" y="582">aggregateVersion</text></g>
  <g data-node-id="consumer-state-machine" data-node-bounds="850 745 330 80"><rect class="node-shape" x="850" y="745" width="330" height="80" rx="14" stroke="#15803D"/><text class="node-label" x="1015" y="795">消费者状态机</text></g>
  <g data-node-id="transition-decision" data-node-bounds="850 1000 330 90"><rect class="node-shape" x="850" y="1000" width="330" height="90" rx="14" stroke="#15803D"/><text class="small-label" x="1015" y="1057">接受 / 忽略 / 暂存</text></g>
  <g data-node-id="carried-authority" data-node-bounds="1380 275 350 80"><rect class="node-shape authority-shape" x="1380" y="275" width="350" height="80" rx="14" stroke="#C2410C"/><text class="small-label" x="1555" y="325">订单权威</text></g>
  <g data-node-id="state-snapshot-event" data-node-bounds="1380 500 350 90"><rect class="node-shape" x="1380" y="500" width="350" height="90" rx="14" stroke="#C2410C"/><text class="node-label" x="1555" y="557">版本化状态事件</text></g>
  <g data-node-id="autonomous-read" data-node-bounds="1380 745 350 80"><rect class="node-shape" x="1380" y="745" width="350" height="80" rx="14" stroke="#C2410C"/><text class="small-label" x="1555" y="795">自治读取</text></g>
  <g data-node-id="consumer-local-copy" data-node-bounds="1380 990 350 100"><rect class="node-shape" x="1380" y="990" width="350" height="100" rx="14" stroke="#C2410C"/><text class="node-label" x="1555" y="1052">本地副本｜派生只读</text></g>
  <g data-node-id="command" data-node-bounds="1860 265 135 80"><rect class="node-shape authority-shape" x="1860" y="265" width="135" height="80" rx="14"/><text class="small-label" x="1927.5" y="315">命令</text></g>
  <g data-node-id="command-handler" data-node-bounds="2010 265 135 80"><rect class="node-shape authority-shape" x="2010" y="265" width="135" height="80" rx="14"/><text class="small-label" x="2077.5" y="315">处理器</text></g>
  <g data-node-id="aggregate" data-node-bounds="2160 265 150 80"><rect class="node-shape authority-shape" x="2160" y="265" width="150" height="80" rx="14"/><text class="small-label" x="2235" y="315">聚合</text></g>
  <g data-node-id="integration-event" data-node-bounds="1855 500 150 90"><rect class="node-shape" x="1855" y="500" width="150" height="90" rx="14" stroke="#7E22CE"/><text class="small-label" x="1930" y="540">集成</text><text class="small-label" x="1930" y="582">事件</text></g>
  <g data-node-id="integration-mapper" data-node-bounds="2015 500 135 90"><rect class="node-shape" x="2015" y="500" width="135" height="90" rx="14" stroke="#7E22CE"/><text class="small-label" x="2082.5" y="540">集成</text><text class="small-label" x="2082.5" y="574">映射器</text></g>
  <g data-node-id="event-broker" data-node-bounds="2160 500 145 90"><rect class="node-shape" x="2160" y="500" width="145" height="90" rx="14" stroke="#7E22CE"/><text class="small-label" x="2232.5" y="557">事件代理</text></g>
  <g data-node-id="read-projection" data-node-bounds="1960 745 270 90"><rect class="node-shape" x="1960" y="745" width="270" height="90" rx="14" stroke="#7E22CE"/><text class="small-label" x="2095" y="802">读取投影｜派生</text></g>
  <g data-node-id="event-store" data-node-bounds="1960 990 270 100"><rect class="node-shape authority-shape" x="1960" y="990" width="270" height="100" rx="14"/><text class="small-label" x="2095" y="1035">事件存储｜权威事实</text><text class="small-label" x="2095" y="1077">按聚合有序</text></g>
  <g data-node-id="replay-path" data-node-bounds="1960 1250 270 80"><rect class="node-shape" x="1960" y="1250" width="270" height="80" rx="14" stroke="#92400E"/><text class="node-label" x="2095" y="1300">受控回放</text></g>
  <g data-node-id="forbidden-side-effects" data-node-bounds="1835 1350 500 55"><rect x="1835" y="1350" width="500" height="55" rx="12" fill="#FEF2F2" stroke="#B91C1C" stroke-width="4"/><text class="note" x="2085" y="1387">✕ 不回放支付 / 通知</text></g>

  <path class="event-delivery-edge edge" data-edge-id="n-deliver" data-source="notification-authority" data-target="notification-event" d="M 395 355 H 410 V 500"/><text class="edge-label" data-edge-id="n-deliver" x="520" y="420">发布</text>
  <path class="event-delivery-edge edge" data-edge-id="n-broker" data-source="notification-event" data-target="notification-broker" d="M 490 545 H 510"/><text class="edge-label" data-edge-id="n-broker" x="595" y="650">投递</text>
  <path class="event-delivery-edge edge" data-edge-id="n-consume" data-source="notification-broker" data-target="notification-consumer" d="M 595 590 H 720 V 700 H 385 V 745"/><text class="edge-label" data-edge-id="n-consume" x="620" y="700">接收</text>
  <path class="sync-lookup-edge edge" data-edge-id="n-lookup" data-source="notification-consumer" data-target="notification-lookup" d="M 470 785 H 500"/><text class="edge-label" data-edge-id="n-lookup" x="590" y="900">同步回查</text>
  <path class="sync-lookup-edge edge" data-edge-id="n-authority-return" data-source="notification-lookup" data-target="notification-authority" d="M 690 785 H 725 V 240 H 395 V 275"/><text class="edge-label" data-edge-id="n-authority-return" x="570" y="180">权威读取</text>
  <path class="event-delivery-edge edge" data-edge-id="t-event" data-source="order-transition" data-target="transition-event" d="M 1015 355 H 1035 V 500"/><text class="edge-label" data-edge-id="t-event" x="1160" y="420">发布转移</text>
  <path class="event-delivery-edge edge" data-edge-id="t-consume" data-source="transition-event" data-target="consumer-state-machine" d="M 1015 590 H 1045 V 745"/><text class="edge-label" data-edge-id="t-consume" x="1165" y="675">驱动</text>
  <path class="event-delivery-edge edge" data-edge-id="t-decide" data-source="consumer-state-machine" data-target="transition-decision" d="M 1015 825 H 1060 V 1000"/><text class="edge-label" data-edge-id="t-decide" x="1165" y="925">校验迁移</text>
  <path class="event-delivery-edge edge" data-edge-id="c-event" data-source="carried-authority" data-target="state-snapshot-event" d="M 1555 355 H 1580 V 500"/><text class="edge-label" data-edge-id="c-event" x="1690" y="420">发布状态</text>
  <path class="event-delivery-edge edge" data-edge-id="c-copy" data-source="state-snapshot-event" data-target="consumer-local-copy" d="M 1555 590 H 1600 V 990"/><text class="edge-label" data-edge-id="c-copy" x="1690" y="675">更新副本</text>
  <path class="sync-lookup-edge edge" data-edge-id="c-read" data-source="consumer-local-copy" data-target="autonomous-read" d="M 1380 1040 H 1330 V 785 H 1380"/><text class="edge-label" data-edge-id="c-read" x="1450" y="925">自治读取</text>
  <path class="command-edge edge" data-edge-id="es-command" data-source="command" data-target="command-handler" d="M 1995 305 H 2010"/><text class="edge-label" data-edge-id="es-command" x="1930" y="395">命令</text>
  <path class="command-edge edge" data-edge-id="es-handle" data-source="command-handler" data-target="aggregate" d="M 2145 305 H 2160"/><text class="edge-label" data-edge-id="es-handle" x="2080" y="420">处理</text>
  <path class="command-edge edge" data-edge-id="es-append" data-source="aggregate" data-target="event-store" d="M 2310 305 H 2330 V 1040 H 2230"/><text class="edge-label" data-edge-id="es-append" x="2160" y="690">乐观追加</text>
  <path class="event-delivery-edge edge" data-edge-id="es-project" data-source="event-store" data-target="read-projection" d="M 2095 990 H 2070 V 835"/><text class="edge-label" data-edge-id="es-project" x="2270" y="920">更新投影</text>
  <path class="event-delivery-edge edge" data-edge-id="es-map" data-source="event-store" data-target="integration-mapper" d="M 1960 1040 H 1870 V 620 H 2082.5 V 590"/><text class="edge-label" data-edge-id="es-map" x="1950" y="690">映射</text>
  <path class="event-delivery-edge edge" data-edge-id="es-integrate" data-source="integration-mapper" data-target="integration-event" d="M 2015 545 H 2005"/><text class="edge-label" data-edge-id="es-integrate" x="2070" y="650">集成</text>
  <path class="event-delivery-edge edge" data-edge-id="es-publish" data-source="integration-event" data-target="event-broker" d="M 2005 530 H 2160"/><text class="edge-label" data-edge-id="es-publish" x="2080" y="450">代理发布</text>
  <path class="replay-edge edge" data-edge-id="es-replay-aggregate" data-source="replay-path" data-target="aggregate" d="M 2230 1290 H 2350 V 220 H 2235 V 265"/><text class="edge-label" data-edge-id="es-replay-aggregate" x="2140" y="1190">重建聚合</text>
  <path class="replay-edge edge" data-edge-id="es-replay-projection" data-source="replay-path" data-target="read-projection" d="M 1960 1290 H 1890 V 790 H 1960"/><text class="edge-label" data-edge-id="es-replay-projection" x="2075" y="1170">重建投影</text>

  <g data-node-id="legend-band" data-node-bounds="240 1470 2100 260"><rect x="240" y="1470" width="2100" height="260" rx="18" fill="#FFFFFF" stroke="#475569" stroke-width="4"/><text class="legend-label" x="280" y="1525">图例（颜色不是唯一编码）</text></g>
  <g data-node-id="legend-command-caption" data-node-bounds="330 1550 400 60"><path class="command-edge" data-legend-key="command" d="M 345 1580 H 435"/><text class="legend-label" data-legend-for="command" data-legend-entry="command" x="470" y="1592">命令：实线 + 三角箭头</text></g>
  <g data-node-id="legend-event-delivery-caption" data-node-bounds="820 1550 450 60"><path class="event-delivery-edge" data-legend-key="event-delivery" d="M 835 1580 H 925"/><text class="legend-label" data-legend-for="event-delivery" data-legend-entry="event-delivery" x="960" y="1592">事件投递：虚线 + 三角箭头</text></g>
  <g data-node-id="legend-sync-lookup-caption" data-node-bounds="1360 1550 450 60"><path class="sync-lookup-edge" data-legend-key="sync-lookup" d="M 1375 1580 H 1465"/><text class="legend-label" data-legend-for="sync-lookup" data-legend-entry="sync-lookup" x="1500" y="1592">同步回查：实线 + 空心箭头</text></g>
  <g data-node-id="legend-replay-caption" data-node-bounds="1870 1550 400 60"><path class="replay-edge" data-legend-key="replay" d="M 1885 1580 H 1975"/><text class="legend-label" data-legend-for="replay" data-legend-entry="replay" x="2010" y="1592">回放：点线 + 菱形箭头</text></g>
  <g data-node-id="legend-symbols" data-node-bounds="430 1650 1700 50"><text class="legend-label" x="430" y="1687">◎ 权威状态　▣ 派生副本　▤ 读取投影　✕ 不可回放外部副作用</text></g>
</svg>
