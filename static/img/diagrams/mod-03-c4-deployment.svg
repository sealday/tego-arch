      .boundary-title{font-size:30px;font-weight:760}.node-title{font-size:24px;font-weight:720}
      .node-type{font-size:15px;font-weight:700;letter-spacing:.7px;fill:#55514b}
      .edge-label{font-size:23px;font-weight:650;fill:#55514b}.legend{font-size:18px;font-weight:650}
    </style>
