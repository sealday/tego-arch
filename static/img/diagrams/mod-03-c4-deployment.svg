<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="deployment-title deployment-description">
  <title id="deployment-title">费用申报系统 Deployment 教学演练假设拓扑</title>
  <desc id="deployment-description">教学演练假设拓扑：Container 实例映射到部署节点；不代表生产事实，也不证明容量、冗余、韧性或故障切换。</desc>
