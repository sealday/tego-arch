  <path class="sync" data-edge-id="order-contract-dispatch" data-source="order-public-contract" data-target="order-internal-implementation" d="M352 336 V402"/>
  <text class="edge-label" data-edge-id="order-contract-dispatch" x="250" y="380" text-anchor="middle" data-label-bounds="169.5 353 161 27" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">进入订单模块</text>
  <path class="sync" data-edge-id="inventory-contract-dispatch" data-source="inventory-public-contract" data-target="inventory-internal-implementation" d="M882 336 V402"/>
