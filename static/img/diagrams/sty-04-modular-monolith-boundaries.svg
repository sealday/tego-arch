  <title id="sty04-title">模块化单体的模块合同、数据所有权与单一部署边界</title>
  <desc id="sty04-desc">单一部署单元内，订单、库存、支付和通知模块只通过公开合同同步协作，并通过订单数据中的 Outbox、事件发布登记和异步投递连接通知；各自拥有权威数据的唯一写入责任，同时共享进程故障域。</desc>
  <defs>
    <marker id="sty04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.boundary-title,.node-title{font-size:23px;font-weight:700;fill:#172033}.node-type{font-size:16px;font-weight:600;fill:#475569}.edge-label,.legend-label{font-size:23px;font-weight:650;fill:#334155}.sync{fill:none;stroke:#334155;stroke-width:2.5;stroke-dasharray:none;marker-end:url(#sty04-arrow)}.event{fill:none;stroke:#7C3AED;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#sty04-arrow)}.module{stroke-width:2.5}.contract,.implementation,.data-node{stroke-width:2}.note{font-size:23px;font-weight:700;fill:#7C2D12}.note-purple{font-size:23px;font-weight:700;fill:#5B21B6}
  </style>

