<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="mod13-title mod13-desc">
  <title id="mod13-title">MOD-13 权威事实与漂移处置闭环</title>
  <desc id="mod13-desc">四类事实源声明各自权威，经生成、验证或观测形成漂移队列，由责任人修复并返回对应权威，重新验证后形成不会反写权威的发布证据。</desc>
  <defs>
    <marker id="arrow-solid" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
    <marker id="arrow-open" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13" fill="none" stroke="#9a3412" stroke-width="2"/>
    </marker>
    <style>
      .region { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .region-title { fill: #0f172a; font: 700 23px system-ui, sans-serif; }
      .node { stroke-width: 2; }
      .node-strong { stroke-width: 3; }
      .node-title { fill: #0f172a; font: 700 23px system-ui, sans-serif; text-anchor: middle; }
      .node-type { fill: #334155; font: 16px system-ui, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow-solid); }
      .feedback { fill: none; stroke: #9a3412; stroke-width: 2; stroke-dasharray: 8 6; stroke-linejoin: round; marker-end: url(#arrow-open); }
      .edge-label { fill: #0f172a; font: 700 23px system-ui, sans-serif; text-anchor: middle; }
      .legend { fill: #334155; font: 16px system-ui, sans-serif; }
    </style>
  </defs>

  <rect class="region" x="30" y="30" width="1140" height="230" rx="16"/>
  <text class="region-title" x="52" y="70">权威事实源</text>
  <rect class="region" x="30" y="280" width="1140" height="400" rx="16"/>
  <text class="region-title" x="52" y="320">同步合同与检测</text>
  <rect class="region" x="30" y="695" width="1140" height="200" rx="16"/>
  <text class="region-title" x="52" y="725">漂移处置与发布</text>

  <path id="declare-code-facts" class="edge" data-source="code-facts" data-target="authority-contract" d="M80 166 V270 H507 V325"/>
  <path id="declare-architecture-source" class="edge" data-source="architecture-source" data-target="authority-contract" d="M355 166 V276 H569 V325"/>
  <path id="declare-adr-state" class="edge" data-source="adr-state" data-target="authority-contract" d="M850 166 V276 H631 V325"/>
  <path id="declare-runtime-evidence" class="edge" data-source="runtime-evidence" data-target="authority-contract" d="M1125 166 V270 H693 V325"/>
  <path id="contract-generate" class="edge" data-source="authority-contract" data-target="generator" d="M523 417 V450 H175 V465"/>
  <path id="contract-validate" class="edge" data-source="authority-contract" data-target="validator" d="M600 417 V465"/>
  <path id="contract-observe" class="edge" data-source="authority-contract" data-target="observer" d="M677 417 V450 H1050 V465"/>
  <path id="generate-drift" class="edge" data-source="generator" data-target="drift-queue" d="M285 511 H295 V621 H490"/>
  <path id="validate-drift" class="edge" data-source="validator" data-target="drift-queue" d="M710 511 H730 V621 H710"/>
  <path id="observe-drift" class="edge" data-source="observer" data-target="drift-queue" d="M940 511 H905 V645 H710"/>
  <path id="queue-repair" class="edge" data-source="drift-queue" data-target="owner-repair" d="M545 667 V716 H250 V755"/>
  <path id="repair-revalidate" class="edge" data-source="owner-repair" data-target="revalidate" d="M375 801 H475"/>
  <path id="revalidate-release" class="edge" data-source="revalidate" data-target="release-evidence" d="M725 801 H825"/>

  <path id="repair-code-facts" class="feedback" data-source="owner-repair" data-target="code-facts" d="M125 783 H46 V166 H65"/>
  <path id="repair-architecture-source" class="feedback" data-source="owner-repair" data-target="architecture-source" d="M125 797 H50 V290 H330 V180 H340"/>
  <path id="repair-adr-state" class="feedback" data-source="owner-repair" data-target="adr-state" d="M375 787 H880 V166 H865"/>
  <path id="repair-runtime-evidence" class="feedback" data-source="owner-repair" data-target="runtime-evidence" d="M375 773 H1152 V166 H1140"/>

  <g data-node-id="code-facts">
    <rect class="node" x="65" y="120" width="250" height="92" rx="14" fill="#dbeafe" stroke="#1d4ed8"/>
    <text class="node-title" x="190" y="150">代码事实</text>
    <text class="node-type" x="190" y="186">受测接口与结构</text>
  </g>
  <g data-node-id="architecture-source">
    <rect class="node" x="340" y="120" width="250" height="92" rx="14" fill="#dcfce7" stroke="#15803d"/>
    <text class="node-title" x="465" y="150">架构模型与图源</text>
    <text class="node-type" x="465" y="186">已批准模型与 Draw.io</text>
  </g>
  <g data-node-id="adr-state">
    <rect class="node" x="615" y="120" width="250" height="92" rx="14" fill="#fef3c7" stroke="#b45309"/>
    <text class="node-title" x="740" y="150">ADR 决策状态</text>
    <text class="node-type" x="740" y="186">状态与替代关系</text>
  </g>
  <g data-node-id="runtime-evidence">
    <rect class="node" x="890" y="120" width="250" height="92" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-dasharray="2 4"/>
    <text class="node-title" x="1015" y="150">部署与运行证据</text>
    <text class="node-type" x="1015" y="186">实际部署与观测</text>
  </g>
  <g data-node-id="authority-contract">
    <rect class="node-strong" x="445" y="325" width="310" height="92" rx="14" fill="#e0f2fe" stroke="#0369a1"/>
    <text class="node-title" x="600" y="354">权威事实合同</text>
    <text class="node-type" x="600" y="390">单一写者 · 方向 · 责任</text>
  </g>
  <g data-node-id="generator">
    <rect class="node" x="65" y="465" width="220" height="92" rx="14" fill="#dbeafe" stroke="#1d4ed8"/>
    <text class="node-title" x="175" y="495">生成器</text>
    <text class="node-type" x="175" y="531">确定性重建派生产物</text>
  </g>
  <g data-node-id="validator">
    <rect class="node" x="490" y="465" width="220" height="92" rx="14" fill="#dcfce7" stroke="#15803d"/>
    <text class="node-title" x="600" y="495">验证器</text>
    <text class="node-type" x="600" y="531">独立事实合同比较</text>
  </g>
  <g data-node-id="observer">
    <rect class="node" x="940" y="465" width="220" height="92" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-dasharray="2 4"/>
    <text class="node-title" x="1050" y="495">观测器</text>
    <text class="node-type" x="1050" y="531">保留实际状态与未知</text>
  </g>
  <g data-node-id="drift-queue">
    <rect class="node" x="490" y="575" width="220" height="92" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="2 4"/>
    <text class="node-title" x="600" y="605">漂移队列</text>
    <text class="node-type" x="600" y="641">差异、未知与分级状态</text>
  </g>
  <g data-node-id="owner-repair">
    <rect class="node" x="125" y="755" width="250" height="92" rx="14" fill="#ffedd5" stroke="#c2410c"/>
    <text class="node-title" x="250" y="785">责任人修复</text>
    <text class="node-type" x="250" y="821">裁决并修改当前权威</text>
  </g>
  <g data-node-id="revalidate">
    <rect class="node" x="475" y="755" width="250" height="92" rx="14" fill="#dcfce7" stroke="#15803d"/>
    <text class="node-title" x="600" y="785">重新验证</text>
    <text class="node-type" x="600" y="821">重建并独立复放检测</text>
  </g>
  <g data-node-id="release-evidence">
    <rect class="node-strong" x="825" y="755" width="250" height="92" rx="14" fill="#e0e7ff" stroke="#4338ca"/>
    <text class="node-title" x="950" y="784">已验证发布证据</text>
    <text class="node-type" x="950" y="820">精确提交、流程与 route</text>
  </g>

  <text class="edge-label" data-edge-id="declare-code-facts" x="190" y="253">声明权威</text>
  <text class="edge-label" data-edge-id="declare-architecture-source" x="465" y="253">声明权威</text>
  <text class="edge-label" data-edge-id="declare-adr-state" x="740" y="253">声明权威</text>
  <text class="edge-label" data-edge-id="declare-runtime-evidence" x="1015" y="253">声明权威</text>
  <text class="edge-label" data-edge-id="contract-generate" x="390" y="433">生成</text>
  <text class="edge-label" data-edge-id="contract-validate" x="800" y="400">验证</text>
  <text class="edge-label" data-edge-id="contract-observe" x="840" y="433">观测</text>
  <text class="edge-label" data-edge-id="generate-drift" x="380" y="600">差异或未知</text>
  <text class="edge-label" data-edge-id="validate-drift" x="800" y="540">差异或未知</text>
  <text class="edge-label" data-edge-id="observe-drift" x="805" y="620">差异或未知</text>
  <text class="edge-label" data-edge-id="queue-repair" x="390" y="690">分级与分派</text>
  <text class="edge-label" data-edge-id="repair-revalidate" x="425" y="890">修改权威或新增替代记录</text>

  <text class="legend" x="75" y="95">实线箭头：生成或检查</text>
  <text class="legend" x="445" y="95">虚线箭头：修复反馈</text>
  <text class="legend" x="800" y="95">点线边框：实际观测或未知</text>
</svg>
