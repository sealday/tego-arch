  <path id="contract-observe" class="edge" data-source="authority-contract" data-target="observer" d="M677 417 V452 H1050 V465"/>
  <path id="generate-drift" class="edge" data-source="generator" data-target="drift-queue" d="M285 511 H295 V621 H490"/>
  <path id="validate-drift" class="edge" data-source="validator" data-target="drift-queue" d="M710 511 H730 V621 H710"/>
