    <text class="node-title" data-text-role="title" data-text-bounds="521 331.5 158 27" x="600" y="354">权威事实合同</text>
    <text class="node-type" data-text-role="type" data-text-bounds="521 375.5 158 19" x="600" y="390">单一写者 · 方向 · 责任</text>
  </g>
  <g data-node-id="generator" data-node-bounds="65 465 220 92">
    <rect class="node" x="65" y="465" width="220" height="92" rx="14" fill="#dbeafe" stroke="#1d4ed8"/>
    <text class="node-title" data-text-role="title" data-text-bounds="101.5 472.5 147 27" x="175" y="495">生成器</text>
    <text class="node-type" data-text-role="type" data-text-bounds="101.5 516.5 147 19" x="175" y="531">确定性重建派生产物</text>
  </g>
  <g data-node-id="validator" data-node-bounds="490 465 220 92">
    <rect class="node" x="490" y="465" width="220" height="92" rx="14" fill="#dcfce7" stroke="#15803d"/>
    <text class="node-title" data-text-role="title" data-text-bounds="534.5 472.5 131 27" x="600" y="495">验证器</text>
    <text class="node-type" data-text-role="type" data-text-bounds="534.5 516.5 131 19" x="600" y="531">独立事实合同比较</text>
  </g>
  <g data-node-id="observer" data-node-bounds="940 465 220 92">
    <rect class="node" x="940" y="465" width="220" height="92" rx="14" fill="#f3e8ff" stroke="#7e22ce" stroke-dasharray="2 4"/>
    <text class="node-title" data-text-role="title" data-text-bounds="976.5 472.5 147 27" x="1050" y="495">观测器</text>
    <text class="node-type" data-text-role="type" data-text-bounds="976.5 516.5 147 19" x="1050" y="531">保留实际状态与未知</text>
  </g>
  <g data-node-id="drift-queue" data-node-bounds="490 575 220 92">
    <rect class="node" x="490" y="575" width="220" height="92" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-dasharray="2 4"/>
    <text class="node-title" data-text-role="title" data-text-bounds="518.5 582.5 163 27" x="600" y="605">漂移队列</text>
    <text class="node-type" data-text-role="type" data-text-bounds="518.5 626.5 163 19" x="600" y="641">差异、未知与分级状态</text>
  </g>
  <g data-node-id="owner-repair" data-node-bounds="125 780 250 92">
