  <text class="edge-label" data-edge-id="declare-adr-state" data-label-bounds="694 230.5 92 27" data-stroke-clearance-css="12.33" data-arrow-clearance-css="50.25" data-node-clearance-css="12.33" x="740" y="253">声明权威</text>
  <text class="edge-label" data-edge-id="declare-runtime-evidence" data-label-bounds="969 230.5 92 27" data-stroke-clearance-css="8.33" data-arrow-clearance-css="179.85" data-node-clearance-css="12.33" x="1015" y="253">声明权威</text>
  <text class="edge-label" data-edge-id="contract-generate" data-label-bounds="367 410.5 46 27" data-stroke-clearance-css="8.33" data-arrow-clearance-css="120.45" data-node-clearance-css="21.33" x="390" y="433">生成</text>
  <text class="edge-label" data-edge-id="contract-validate" data-label-bounds="777 377.5 46 27" data-stroke-clearance-css="118.30" data-arrow-clearance-css="114.65" data-node-clearance-css="14.67" x="800" y="400">验证</text>
  <text class="edge-label" data-edge-id="contract-observe" data-label-bounds="817 410.5 46 27" data-stroke-clearance-css="8.33" data-arrow-clearance-css="117.12" data-node-clearance-css="41.33" x="840" y="433">观测</text>
