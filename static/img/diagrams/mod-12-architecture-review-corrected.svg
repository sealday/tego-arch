  <text x="217" y="194" text-anchor="middle" class="edge-label" data-edge-id="edge-employee-web" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">使用｜费用资料</text>
  <text x="435" y="220" text-anchor="middle" textLength="190" lengthAdjust="spacingAndGlyphs" class="edge-label" data-edge-id="edge-web-api" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">提交申报｜费用资料</text>
  <text x="400" y="420" text-anchor="middle" textLength="220" lengthAdjust="spacingAndGlyphs" class="edge-label" data-edge-id="edge-api-database" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">读写｜已提交的费用事实</text>
  <text x="735" y="420" text-anchor="middle" textLength="210" lengthAdjust="spacingAndGlyphs" class="edge-label" data-edge-id="edge-api-worker" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">创建支付任务｜支付任务</text>
