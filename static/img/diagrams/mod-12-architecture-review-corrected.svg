  <text x="180" y="132" class="edge-label">费用申报系统 Container 图</text>
  <g><path d="M944 102H1136Q1150 102 1150 116V132Q1150 146 1136 146H944Q930 146 930 132V116Q930 102 944 102Z" fill="#f2e6cf" stroke="#8b7855" stroke-width="2"/><text x="1040" y="132" text-anchor="middle" class="edge-label">协议：待确认</text></g>
  <path data-boundary-id="system-boundary" data-boundary-bounds="180 140 720 500" d="M194 140H886Q900 140 900 154V626Q900 640 886 640H194Q180 640 180 626V154Q180 140 194 140Z" fill="#eef3ed" stroke="#64806b" stroke-width="3"/>
