  <text x="825" y="465" text-anchor="middle" class="edge-label">支付请求</text>
  <text x="1065" y="495" text-anchor="middle" class="edge-label">银行回执/查询结果</text>

  <g data-layout-id="legend" data-layout-bounds="40 680 1120 120"><path d="M54 680H1146Q1160 680 1160 694V786Q1160 800 1146 800H54Q40 800 40 786V694Q40 680 54 680Z" fill="#fbf8f1" stroke="#b9b1a5" stroke-width="2"/><text x="64" y="708" class="legend-title" textLength="850" lengthAdjust="spacingAndGlyphs">图例与证据边界｜虚线：候选信任/失败边界｜实线：系统边界｜实线箭头：关系方向</text><text x="64" y="736" class="note" textLength="500" lengthAdjust="spacingAndGlyphs">员工↔系统：候选信任边界；认证与授权证据待确认</text><text x="64" y="764" class="note" textLength="510" lengthAdjust="spacingAndGlyphs">系统↔银行：候选信任边界；协议、加密与 SLA 待确认</text><text x="64" y="792" class="note" textLength="510" lengthAdjust="spacingAndGlyphs">银行是外部依赖；候选失败边界，故障隔离与切换待确认</text><text x="610" y="736" class="note" textLength="526" lengthAdjust="spacingAndGlyphs">内部 Container 是否独立失败域：待部署、运行与恢复证据确认</text><text x="610" y="764" class="note">所有跨进程协议：待确认</text><text x="610" y="792" class="note">系统与 Container 团队归属：待确认</text></g>
