<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="corrected-title corrected-description">
  <title id="corrected-title">费用申报系统 Container 图：费用提交与支付协作</title>
  <desc id="corrected-description">修正后的教学图：恢复费用申报系统边界，把银行支付服务放回边界外，标注业务数据、未知协议、候选信任边界和候选失败边界。</desc>
  <defs>
    <marker id="corrected-arrow" markerUnits="strokeWidth" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#263238"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#263238}.diagram-title{font-size:32px;font-weight:760}.version{font-size:23px;fill:#55514b}.boundary-label{font-size:18px;font-weight:700;fill:#47604e}.node-title{font-size:24px;font-weight:720}.node-type{font-size:15px;font-weight:700;letter-spacing:1px;fill:#55514b}.edge-label{font-size:23px;font-weight:650;fill:#55514b}.risk-label{font-size:16px;font-weight:760;fill:#8e3b32}.legend-title,.note{font-size:23px}.legend-title{font-weight:760}
    </style>
  </defs>
  <path d="M0 0H1200V840H0Z" fill="#f6f1e7"/>
