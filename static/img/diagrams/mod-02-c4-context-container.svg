<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 840"
  role="img"
  aria-labelledby="diagram-title diagram-description"
>
  <title id="diagram-title">费用申报系统的 C4 Context 与 Container 映射</title>
  <desc id="diagram-description">上半部分展示员工、费用申报系统和外部银行的 Context 关系，下半部分展开 Web 应用、申报 API、申报数据库和支付任务执行器；关系标签与连续箭头分离，箭头只表示关系。</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#263238" flood-opacity=".09"/>
    </filter>
    <marker id="arrow-ink" markerUnits="strokeWidth" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#263238"/>
    </marker>
    <marker id="arrow-brick" markerUnits="strokeWidth" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#A34A3A"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        fill: #263238;
      }
      .section-title { font-size: 24px; font-weight: 760; letter-spacing: .2px; }
      .section-note { font-size: 14px; fill: #6c6861; }
      .node-title { font-size: 18px; font-weight: 720; }
      .node-type { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
      .inverse-title { fill: #fff; }
      .inverse-type { fill: #dce7ea; }
      .edge-label { font-size: 13px; font-weight: 650; fill: #55514b; }
      .zoom-label { fill: #a34a3a; }
      .badge { font-size: 12px; font-weight: 760; letter-spacing: .6px; fill: #55705d; }
    </style>
  </defs>

  <path d="M0 0H1200V840H0Z" fill="#F6F1E7"/>

  <path d="M80 54H1120Q1144 54 1144 78V320Q1144 344 1120 344H80Q56 344 56 320V78Q56 54 80 54Z" fill="#FBF8F1" stroke="#B9B1A5" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="88" y="98" class="section-title">Context：费用申报系统边界</text>
  <text x="88" y="126" class="section-note">只表达系统与边界外参与者的关系，不表达调用先后</text>

  <path d="M105 188Q105 172 121 172H279Q295 172 295 188V266Q295 282 279 282H121Q105 282 105 266Z" fill="#ECE8E1" stroke="#77716A" stroke-width="2"/>
  <text x="200" y="211" text-anchor="middle" class="node-title">员工</text>
  <text x="200" y="244" text-anchor="middle" class="node-type" fill="#77716A">PERSON</text>

  <path d="M455 154Q455 142 467 142H733Q745 142 745 154V296Q745 308 733 308H467Q455 308 455 296Z" fill="none" stroke="#405D6B" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M480 181Q480 165 496 165H704Q720 165 720 181V267Q720 283 704 283H496Q480 283 480 267Z" fill="#405D6B" stroke="#304854" stroke-width="2"/>
  <text x="600" y="208" text-anchor="middle" class="node-title inverse-title">费用申报系统</text>
  <text x="600" y="242" text-anchor="middle" class="node-type inverse-type">SYSTEM OF INTEREST</text>

  <path d="M895 188Q895 172 911 172H1079Q1095 172 1095 188V266Q1095 282 1079 282H911Q895 282 895 266Z" fill="#ECE8E1" stroke="#77716A" stroke-width="2"/>
  <text x="995" y="211" text-anchor="middle" class="node-title">银行支付服务</text>
  <text x="995" y="244" text-anchor="middle" class="node-type" fill="#77716A">EXTERNAL SYSTEM</text>

  <path d="M296 227H470" fill="none" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-ink)"/>
  <path d="M720 227H885" fill="none" stroke="#263238" stroke-width="2.4" marker-end="url(#arrow-ink)"/>
  <text x="382" y="202" text-anchor="middle" class="edge-label" data-clearance="8">提交费用</text>
  <text x="812" y="202" text-anchor="middle" class="edge-label" data-clearance="8">请求付款</text>

  <path d="M80 414H1120Q1144 414 1144 438V776Q1144 800 1120 800H80Q56 800 56 776V438Q56 414 80 414Z" fill="#FBF8F1" stroke="#B9B1A5" stroke-width="2" filter="url(#soft-shadow)"/>
  <text x="88" y="458" class="section-title">Container：展开费用申报系统</text>
  <text x="88" y="486" class="section-note">边界内只放真实的可运行或存储单元，外部依赖仍留在边界外</text>

  <path d="M257 505H903Q915 505 915 517V773Q915 785 903 785H257Q245 785 245 773V517Q245 505 257 505Z" fill="#EEF3ED" stroke="#64806B" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="270" y="526" class="badge">费用申报系统内部</text>
  <path d="M600 283V495" fill="none" stroke="#A34A3A" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-brick)"/>
  <text x="626" y="391" class="edge-label zoom-label" data-clearance="8">展开目标系统</text>

  <path d="M65 549Q65 535 79 535H191Q205 535 205 549V611Q205 625 191 625H79Q65 625 65 611Z" fill="#ECE8E1" stroke="#77716A" stroke-width="2"/>
  <text x="135" y="571" text-anchor="middle" class="node-title">员工</text>
  <text x="135" y="600" text-anchor="middle" class="node-type" fill="#77716A">PERSON</text>

  <path d="M270 549Q270 535 284 535H416Q430 535 430 549V611Q430 625 416 625H284Q270 625 270 611Z" fill="#D9E5DA" stroke="#64806B" stroke-width="2"/>
  <text x="350" y="571" text-anchor="middle" class="node-title">Web 应用</text>
  <text x="350" y="600" text-anchor="middle" class="node-type" fill="#55705D">CONTAINER</text>

  <path d="M530 549Q530 535 544 535H676Q690 535 690 549V611Q690 625 676 625H544Q530 625 530 611Z" fill="#D9E5DA" stroke="#64806B" stroke-width="2"/>
  <text x="610" y="571" text-anchor="middle" class="node-title">申报 API</text>
  <text x="610" y="600" text-anchor="middle" class="node-type" fill="#55705D">CONTAINER</text>

  <path d="M745 550C745 536 780 525 823 525S900 536 900 550V610C900 624 866 635 823 635S745 624 745 610Z" fill="#E8E1CF" stroke="#8B7855" stroke-width="2"/>
  <path d="M745 550C745 564 780 575 823 575S900 564 900 550" fill="none" stroke="#8B7855" stroke-width="2"/>
  <text x="823" y="570" text-anchor="middle" class="node-title">申报数据库</text>
  <text x="823" y="600" text-anchor="middle" class="node-type" fill="#7A6849">DATA STORE</text>

  <path d="M690 699Q690 685 704 685H866Q880 685 880 699V757Q880 771 866 771H704Q690 771 690 757Z" fill="#D9E5DA" stroke="#64806B" stroke-width="2"/>
  <text x="785" y="721" text-anchor="middle" class="node-title">支付任务执行器</text>
  <text x="785" y="750" text-anchor="middle" class="node-type" fill="#55705D">CONTAINER</text>

  <path d="M1010 699Q1010 685 1024 685H1126Q1140 685 1140 699V757Q1140 771 1126 771H1024Q1010 771 1010 757Z" fill="#ECE8E1" stroke="#77716A" stroke-width="2"/>
  <text x="1075" y="721" text-anchor="middle" class="node-title">银行支付服务</text>
  <text x="1075" y="750" text-anchor="middle" class="node-type" fill="#77716A">EXTERNAL</text>

  <path d="M206 580H260" fill="none" stroke="#263238" stroke-width="2.2" marker-end="url(#arrow-ink)"/>
  <path d="M431 580H520" fill="none" stroke="#263238" stroke-width="2.2" marker-end="url(#arrow-ink)"/>
  <path d="M691 580H735" fill="none" stroke="#263238" stroke-width="2.2" marker-end="url(#arrow-ink)"/>
  <path d="M680 626V670H709V675" fill="none" stroke="#263238" stroke-width="2.2" marker-end="url(#arrow-ink)"/>
  <path d="M881 728H1000" fill="none" stroke="#263238" stroke-width="2.2" marker-end="url(#arrow-ink)"/>

  <text x="238" y="556" text-anchor="middle" class="edge-label" data-clearance="8">使用</text>
  <text x="475" y="556" text-anchor="middle" class="edge-label" data-clearance="8">提交申报</text>
  <text x="715" y="556" text-anchor="middle" class="edge-label" data-clearance="8">读写</text>
  <text x="610" y="654" text-anchor="middle" class="edge-label" data-clearance="8">创建支付任务</text>
  <text x="955" y="704" text-anchor="middle" class="edge-label" data-clearance="8">请求付款</text>
</svg>
