<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="pr15-title pr15-desc">
  <title id="pr15-title">Conway 组织与系统反馈图</title>
  <desc id="pr15-desc">沟通路径经由团队边界和系统边界形成交付反馈；平台能力与团队、系统边界构成反馈回路。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#3568A8"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#2E7D5B"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#B56A15"/></marker>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#52616B"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#FFFFFF"/>
  <path d="M260 320 H330" fill="none" stroke="#3568A8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M560 290 H650" fill="none" stroke="#2E7D5B" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M880 320 H950" fill="none" stroke="#B56A15" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M765 400 V470" fill="none" stroke="#52616B" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M500 525 H445 V400" fill="none" stroke="#52616B" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <text x="295" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#17324D">约束协作</text>
  <text x="605" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#173D2D">塑造边界</text>
  <text x="915" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#53300A">产生反馈</text>
  <text x="950" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#1F2A30">提出支撑需求</text>
  <text x="350" y="485" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#1F2A30">降低认知负荷</text>
  <g>
    <rect x="50" y="240" width="210" height="160" rx="16" fill="#E8F1FF" stroke="#3568A8" stroke-width="3"/>
    <text x="155" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#17324D">沟通路径</text>
    <text x="155" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#36546B">协作约束</text>
  </g>
  <g>
    <rect x="330" y="180" width="230" height="220" rx="16" fill="#EAF7F0" stroke="#2E7D5B" stroke-width="3"/>
    <text x="445" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#173D2D">团队边界</text>
    <text x="445" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#36546B">能力与所有权</text>
  </g>
  <g>
    <rect x="650" y="180" width="230" height="220" rx="16" fill="#FFF4E5" stroke="#B56A15" stroke-width="3"/>
    <text x="765" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#53300A">系统边界</text>
    <text x="765" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#36546B">接口与依赖</text>
  </g>
  <g>
    <rect x="950" y="240" width="200" height="160" rx="16" fill="#F4EDFF" stroke="#7654A6" stroke-width="3"/>
    <text x="1050" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#34204D">交付反馈</text>
    <text x="1050" y="342" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#36546B">观察与复核</text>
  </g>
  <g>
    <rect x="500" y="470" width="360" height="120" rx="16" fill="#F0F3F5" stroke="#52616B" stroke-width="3"/>
    <text x="680" y="518" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#1F2A30">平台能力</text>
    <text x="680" y="554" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#36546B">受治理的共享支撑</text>
  </g>
</svg>
