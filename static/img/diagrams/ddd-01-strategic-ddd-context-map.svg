  <g data-semantic-id="payment-acl"><rect x="80" y="1080" width="180" height="64" rx="8" ry="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="104" y="1122" font-size="15">支付结算内部 ACL</tspan></text></g>
  <g data-semantic-id="legend"><rect x="40" y="1870" width="720" height="250" rx="8" ry="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="64" y="1912" font-size="15">U：上游；D：下游；</tspan>

<tspan x="64" y="1948" font-size="15">C/S：Customer/Supplier；</tspan>

<tspan x="64" y="1984" font-size="15">OHS：Open Host Service；</tspan>

<tspan x="64" y="2020" font-size="15">PL：Published Language；</tspan>

<tspan x="64" y="2056" font-size="15">ACL：Anti-Corruption Layer；</tspan>

<tspan x="64" y="2092" font-size="15">关系模式不是传输协议</tspan></text></g>
  <g data-semantic-id="failure-boundary"><rect x="40" y="2150" width="720" height="90" rx="8" ry="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="64" y="2185" font-size="15">未知支付结果：查询支付事实所有者或人工终态；</tspan>

