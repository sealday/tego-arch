<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2260" role="img" aria-labelledby="ddd-title ddd-desc" fill="none" data-illustration-id="src-atlas-ddd01-strategic-context-map" data-drawio-sha256="f298f1193503b1eb419786d10e94db9c1c92272f08707df1e0bf9d9f82c2b4a1">
  <title id="ddd-title">战略 DDD：说明性订单履约 Context Map</title>
  <desc id="ddd-desc">本站原创说明性场景。五个候选限界上下文表示本地语言与事实所有权，不代表微服务、团队、数据库或部署单元。箭头从 U 指向 D，逐条标明交换事实、关系模式、翻译位置与失败责任；支付结算拥有外部模型翻译，客户支持仅消费只读组合事实。</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#71839b"/></marker></defs>
  <g data-semantic-id="system-boundary"><rect x="40" y="190" width="740" height="1640" rx="0" fill="none" stroke="#71839b" stroke-width="2" stroke-dasharray="8 6"/><text stroke="#edf3fa" stroke-width="4" paint-order="stroke" fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="64" y="232" font-size="18">订单履约系统边界</tspan></text></g>
  <g data-semantic-id="external-system-boundary"><rect x="40" y="20" width="260" height="145" rx="0" fill="none" stroke="#71839b" stroke-width="2" stroke-dasharray="8 6"/><text stroke="#edf3fa" stroke-width="4" paint-order="stroke" fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="64" y="62" font-size="18">外部支付系统边界</tspan></text></g>
  <g data-semantic-id="inventory-sales" data-source-id="context-inventory-promise" data-target-id="context-sales-order"><path d="M 160 550 L 160 270 L 385 270 L 385 550" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="177" y="302" width="194" height="152" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="184" y="324" font-size="15">U → D；</tspan><tspan x="184" y="348" font-size="15">预留或拒绝；</tspan><tspan x="184" y="372" font-size="15">Customer/Supplier；</tspan><tspan x="184" y="396" font-size="15">翻译：销售订单本地语言适</tspan><tspan x="184" y="420" font-size="15">配；</tspan><tspan x="184" y="444" font-size="15">失败：不能猜测库存已预留</tspan></text></g>
  <g data-semantic-id="payment-sales" data-source-id="context-payment-settlement" data-target-id="context-sales-order"><path d="M 280 1040 L 305 1040 L 305 615.8 L 340 615.8" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="786" width="224" height="152" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="332" y="808" font-size="15">U → D；</tspan><tspan x="332" y="832" font-size="15">资金确认或未知结果；</tspan><tspan x="332" y="856" font-size="15">Customer/Supplier；</tspan><tspan x="332" y="880" font-size="15">翻译：销售订单本地语言适配；</tspan><tspan x="332" y="904" font-size="15">失败：未知结果回到支付结算查</tspan><tspan x="332" y="928" font-size="15">询</tspan></text></g>
  <g data-semantic-id="sales-fulfillment" data-source-id="context-sales-order" data-target-id="context-fulfillment-delivery"><path d="M 475 550 L 475 250 L 690 250 L 690 550" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="489" y="282" width="179" height="152" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="496" y="304" font-size="15">U → D；</tspan><tspan x="496" y="328" font-size="15">已接受商业承诺；</tspan><tspan x="496" y="352" font-size="15">OHS + PL；</tspan><tspan x="496" y="376" font-size="15">翻译：履约配送入口；</tspan><tspan x="496" y="400" font-size="15">失败：等待确认事实而非</tspan><tspan x="496" y="424" font-size="15">重判订单</tspan></text></g>
  <g data-semantic-id="provider-payment" data-source-id="external-payment-provider" data-target-id="context-payment-settlement"><path d="M 60 110 L 20 110 L 20 1085 L 60 1085" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="53" y="752" width="224" height="128" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="60" y="774" font-size="15">U → D；</tspan><tspan x="60" y="798" font-size="15">外部授权扣款退款结果；</tspan><tspan x="60" y="822" font-size="15">ACL；</tspan><tspan x="60" y="846" font-size="15">翻译：支付结算内部 ACL；</tspan><tspan x="60" y="870" font-size="15">失败：查询权威状态或人工终态</tspan></text></g>
  <g data-semantic-id="sales-view" data-source-id="context-sales-order" data-target-id="support-view"><path d="M 520 578.2 L 580 578.2 L 580 1370 L 520 1370 L 520 1400" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="331" y="1158" width="209" height="128" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="338" y="1180" font-size="15">U → D；</tspan><tspan x="338" y="1204" font-size="15">商业订单状态；</tspan><tspan x="338" y="1228" font-size="15">OHS + PL；</tspan><tspan x="338" y="1252" font-size="15">翻译：组合视图投影器；</tspan><tspan x="338" y="1276" font-size="15">失败：展示陈旧但不能写订单</tspan></text></g>
  <g data-semantic-id="payment-view" data-source-id="context-payment-settlement" data-target-id="support-view"><path d="M 280 1130 L 300 1130 L 300 1445 L 340 1445" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="59" y="1218" width="209" height="152" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="66" y="1240" font-size="15">U → D；</tspan><tspan x="66" y="1264" font-size="15">资金动作状态；</tspan><tspan x="66" y="1288" font-size="15">OHS + PL；</tspan><tspan x="66" y="1312" font-size="15">翻译：组合视图投影器；</tspan><tspan x="66" y="1336" font-size="15">失败：不能把陈旧投影当作资</tspan><tspan x="66" y="1360" font-size="15">金终态</tspan></text></g>
  <g data-semantic-id="fulfillment-view" data-source-id="context-fulfillment-delivery" data-target-id="support-view"><path d="M 760 597 L 770 597 L 770 1445 L 580 1445" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="595" y="1068" width="149" height="176" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="602" y="1090" font-size="15">U → D；</tspan><tspan x="602" y="1114" font-size="15">配送任务状态；</tspan><tspan x="602" y="1138" font-size="15">OHS + PL；</tspan><tspan x="602" y="1162" font-size="15">翻译：组合视图投影</tspan><tspan x="602" y="1186" font-size="15">器；</tspan><tspan x="602" y="1210" font-size="15">失败：不能把陈旧投</tspan><tspan x="602" y="1234" font-size="15">影当作交付事实</tspan></text></g>
  <g data-semantic-id="view-support" data-source-id="support-view" data-target-id="context-customer-support"><path d="M 460 1490 L 460 1590 L 460 1700" fill="none" stroke="#71839b" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="1524" width="239" height="128" rx="5" fill="#f3f6fb" stroke="none"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="492" y="1546" font-size="15">U → D；</tspan><tspan x="492" y="1570" font-size="15">面向补救的只读组合事实；</tspan><tspan x="492" y="1594" font-size="15">Published Language；</tspan><tspan x="492" y="1618" font-size="15">翻译：客户支持读取入口；</tspan><tspan x="492" y="1642" font-size="15">失败：补救命令仍交回事实所有者</tspan></text></g>
  <g data-semantic-id="context-sales-order"><rect x="340" y="550" width="180" height="94" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="364" y="592" font-size="18">销售订单</tspan></text></g>
  <g data-semantic-id="context-inventory-promise"><rect x="60" y="550" width="200" height="94" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="84" y="592" font-size="18">库存承诺</tspan></text></g>
  <g data-semantic-id="context-payment-settlement"><rect x="60" y="1010" width="220" height="150" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="84" y="1052" font-size="18">支付结算</tspan></text></g>
  <g data-semantic-id="context-fulfillment-delivery"><rect x="620" y="550" width="140" height="94" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="644" y="592" font-size="18">履约配送</tspan></text></g>
  <g data-semantic-id="context-customer-support"><rect x="340" y="1700" width="240" height="90" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="364" y="1742" font-size="18">客户支持</tspan></text></g>
  <g data-semantic-id="support-view"><rect x="340" y="1400" width="240" height="90" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="364" y="1442" font-size="18">只读组合视图</tspan></text></g>
  <g data-semantic-id="external-payment-provider"><rect x="60" y="75" width="220" height="70" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="18"><tspan x="84" y="117" font-size="18">外部支付提供方</tspan></text></g>
  <g data-semantic-id="payment-acl"><rect x="80" y="1080" width="180" height="64" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="104" y="1122" font-size="15">支付结算内部 ACL</tspan></text></g>
  <g data-semantic-id="legend"><rect x="40" y="1870" width="720" height="250" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="64" y="1912" font-size="15">U：上游；D：下游；</tspan><tspan x="64" y="1936" font-size="15">C/S：Customer/Supplier；</tspan><tspan x="64" y="1960" font-size="15">OHS：Open Host Service；</tspan><tspan x="64" y="1984" font-size="15">PL：Published Language；</tspan><tspan x="64" y="2008" font-size="15">ACL：Anti-Corruption Layer；</tspan><tspan x="64" y="2032" font-size="15">关系模式不是传输协议</tspan></text></g>
  <g data-semantic-id="failure-boundary"><rect x="40" y="2150" width="720" height="90" rx="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC, sans-serif" font-size="15"><tspan x="64" y="2192" font-size="15">未知支付结果：查询支付事实所有者或人工终态；</tspan><tspan x="64" y="2216" font-size="15">组合视图失败不转移写入权</tspan></text></g>
</svg>
