<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2260" role="img" aria-labelledby="ddd-title ddd-desc" fill="none" data-illustration-id="src-atlas-ddd01-strategic-context-map" data-drawio-sha256="b4fd807520f5f9091fccca446b29714b6ba093d97b699b109c09b6333c62e6be">
  <title id="ddd-title">战略 DDD：说明性订单履约 Context Map</title>
  <desc id="ddd-desc">本站原创说明性场景。五个候选限界上下文表示本地语言与事实所有权，不代表微服务、团队、数据库或部署单元。箭头从 U 指向 D，逐条标明交换事实、关系模式、翻译位置与失败责任；支付结算拥有外部模型翻译，客户支持仅消费只读组合事实。</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="-2 -10 20 20" markerWidth="20" markerHeight="20" refX="0" refY="0" orient="auto"><path d="M 14 0 L 0 7 L 0 -7 Z" fill="#71839b" stroke="#71839b" stroke-width="2" stroke-miterlimit="10"/></marker></defs>
  <g data-semantic-id="system-boundary"><rect x="40" y="190" width="740" height="1640" fill="none" stroke="#71839b" stroke-width="2" stroke-dasharray="8 6"/><text fill="#71839b" font-family="Noto Sans SC" font-size="18" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="64" y="232" font-size="18">订单履约系统边界</tspan></text></g>
  <g data-semantic-id="external-system-boundary"><rect x="40" y="20" width="260" height="145" fill="none" stroke="#71839b" stroke-width="2" stroke-dasharray="8 6"/><text fill="#71839b" font-family="Noto Sans SC" font-size="18" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="64" y="62" font-size="18">外部支付系统边界</tspan></text></g>
  <g data-semantic-id="inventory-sales" data-source-id="context-inventory-promise" data-target-id="context-sales-order"><path d="M 160 550 L 160 270 L 385 270 L 385 533.76" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="176" y="304" width="196" height="209" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="184" y="324" font-size="15">U → D；</tspan>

<tspan x="184" y="360" font-size="15">预留或拒绝；</tspan>

<tspan x="184" y="396" font-size="15">Customer/Supplier；</tspan>

<tspan x="184" y="432" font-size="15">翻译：销售订单本地语言适</tspan>

<tspan x="184" y="468" font-size="15">配；</tspan>

<tspan x="184" y="504" font-size="15">失败：不能猜测库存已预留</tspan></text></g>
  <g data-semantic-id="payment-sales" data-source-id="context-payment-settlement" data-target-id="context-sales-order"><path d="M 280 1040 L 305 1040 L 305 615.8 L 323.76 615.8" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="324" y="788" width="226" height="209" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="332" y="808" font-size="15">U → D；</tspan>

<tspan x="332" y="844" font-size="15">资金确认或未知结果；</tspan>

<tspan x="332" y="880" font-size="15">Customer/Supplier；</tspan>

<tspan x="332" y="916" font-size="15">翻译：销售订单本地语言适配；</tspan>

<tspan x="332" y="952" font-size="15">失败：未知结果回到支付结算查</tspan>

<tspan x="332" y="988" font-size="15">询</tspan></text></g>
  <g data-semantic-id="sales-fulfillment" data-source-id="context-sales-order" data-target-id="context-fulfillment-delivery"><path d="M 475 550 L 475 250 L 690 250 L 690 533.76" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="488" y="284" width="181" height="209" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="496" y="304" font-size="15">U → D；</tspan>

<tspan x="496" y="340" font-size="15">已接受商业承诺；</tspan>

<tspan x="496" y="376" font-size="15">OHS + PL；</tspan>

<tspan x="496" y="412" font-size="15">翻译：履约配送入口；</tspan>

<tspan x="496" y="448" font-size="15">失败：等待确认事实而非</tspan>

<tspan x="496" y="484" font-size="15">重判订单</tspan></text></g>
  <g data-semantic-id="provider-payment" data-source-id="external-payment-provider" data-target-id="context-payment-settlement"><path d="M 60 110 L 20 110 L 20 1085 L 43.76 1085" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="54" y="754" width="226" height="173" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="62" y="774" font-size="15">U → D；</tspan>

<tspan x="62" y="810" font-size="15">外部授权扣款退款结果；</tspan>

<tspan x="62" y="846" font-size="15">ACL；</tspan>

<tspan x="62" y="882" font-size="15">翻译：支付结算内部 ACL；</tspan>

<tspan x="62" y="918" font-size="15">失败：查询权威状态或人工终态</tspan></text></g>
  <g data-semantic-id="sales-view" data-source-id="context-sales-order" data-target-id="support-view"><path d="M 520 578.2 L 580 578.2 L 580 1370 L 520 1370 L 520 1383.76" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="330" y="1160" width="211" height="173" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="338" y="1180.2" font-size="15">U → D；</tspan>

<tspan x="338" y="1216.2" font-size="15">商业订单状态；</tspan>

<tspan x="338" y="1252.2" font-size="15">OHS + PL；</tspan>

<tspan x="338" y="1288.2" font-size="15">翻译：组合视图投影器；</tspan>

<tspan x="338" y="1324.2" font-size="15">失败：展示陈旧但不能写订单</tspan></text></g>
  <g data-semantic-id="payment-view" data-source-id="context-payment-settlement" data-target-id="support-view"><path d="M 280 1130 L 300 1130 L 300 1445 L 323.76 1445" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="58" y="1220" width="211" height="209" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="66" y="1240" font-size="15">U → D；</tspan>

<tspan x="66" y="1276" font-size="15">资金动作状态；</tspan>

<tspan x="66" y="1312" font-size="15">OHS + PL；</tspan>

<tspan x="66" y="1348" font-size="15">翻译：组合视图投影器；</tspan>

<tspan x="66" y="1384" font-size="15">失败：不能把陈旧投影当作资</tspan>

<tspan x="66" y="1420" font-size="15">金终态</tspan></text></g>
  <g data-semantic-id="fulfillment-view" data-source-id="context-fulfillment-delivery" data-target-id="support-view"><path d="M 760 597 L 770 597 L 770 1445 L 596.24 1445" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="594" y="1070" width="151" height="245" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="602" y="1090" font-size="15">U → D；</tspan>

<tspan x="602" y="1126" font-size="15">配送任务状态；</tspan>

<tspan x="602" y="1162" font-size="15">OHS + PL；</tspan>

<tspan x="602" y="1198" font-size="15">翻译：组合视图投影</tspan>

<tspan x="602" y="1234" font-size="15">器；</tspan>

<tspan x="602" y="1270" font-size="15">失败：不能把陈旧投</tspan>

<tspan x="602" y="1306" font-size="15">影当作交付事实</tspan></text></g>
  <g data-semantic-id="view-support" data-source-id="support-view" data-target-id="context-customer-support"><path d="M 460 1490 L 460 1590 L 460 1683.76" fill="none" stroke="#71839b" stroke-width="2" stroke-miterlimit="10" marker-end="url(#arrow)"/><rect x="486" y="1506" width="241" height="173" fill="#f3f6fb" stroke="none" stroke-width="0"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="15" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="494" y="1526" font-size="15">U → D；</tspan>

<tspan x="494" y="1562" font-size="15">面向补救的只读组合事实；</tspan>

<tspan x="494" y="1598" font-size="15">Published Language；</tspan>

<tspan x="494" y="1634" font-size="15">翻译：客户支持读取入口；</tspan>

<tspan x="494" y="1670" font-size="15">失败：补救命令仍交回事实所有者</tspan></text></g>
