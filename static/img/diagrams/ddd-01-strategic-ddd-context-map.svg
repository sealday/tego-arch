  <g data-semantic-id="context-customer-support"><rect x="340" y="1700" width="240" height="90" rx="8" ry="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="18" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="364" y="1742" font-size="18">客户支持</tspan></text></g>
  <g data-semantic-id="support-view"><rect x="340" y="1400" width="240" height="90" rx="8" ry="8" fill="#edf3fa" stroke="#71839b" stroke-width="2"/><text fill="#172b4d" font-family="Noto Sans SC" font-size="18" font-weight="normal" font-style="normal" text-decoration="none" text-anchor="start"><tspan x="364" y="1442" font-size="18">只读组合视图</tspan></text></g>
