  <g data-node-id="soa-client" data-role="participant" data-node-bounds="80 350 220 100"><rect x="80" y="350" width="220" height="100" rx="18" fill="#FFFFFF" stroke="#334155" stroke-width="4"/><text class="node-title" x="190" y="415">履约请求方</text></g>
