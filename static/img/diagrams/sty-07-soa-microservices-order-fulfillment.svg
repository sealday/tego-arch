<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2450" role="img" aria-labelledby="sty07-title sty07-desc">
  <title id="sty07-title">经典 SOA 与微服务订单履约机制对照</title>
  <desc id="sty07-desc">左右两侧使用相同的订单、库存、支付和通知参与者与履约步骤，对照经典 SOA 的企业流程编排、稳定合同和异构系统，与微服务的团队自治、私有权威数据和独立部署。集成层与共享平台均不拥有业务决定。</desc>
  <defs>
    <marker id="arrow-business" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1D4ED8" stroke="#1D4ED8"/></marker>
    <marker id="arrow-message" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#047857" stroke="#047857"/></marker>
    <marker id="arrow-technical" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748B"/></marker>
    <marker id="arrow-compensation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="strokeWidth" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9A3412" stroke="#9A3412"/></marker>
  </defs>
  <style>
    text { font-family: Inter, "Noto Sans SC", sans-serif; text-anchor: middle; fill: #0F172A; font-size: 48px; }
    .title { font-size: 66px; font-weight: 700; }
    .boundary-title { font-size: 54px; font-weight: 700; }
    .node-title { font-size: 48px; font-weight: 700; }
    .node-type { font-size: 45px; font-weight: 600; fill: #334155; }
    .essential-role { font-size: 48px; font-weight: 700; }
    .edge-label { font-size: 45px; font-weight: 700; }
    .legend-label { font-size: 36px; font-weight: 700; }
    .business-call { fill: none; stroke: #1D4ED8; stroke-width: 4; marker-end: url(#arrow-business); }
    .message { fill: none; stroke: #047857; stroke-width: 4; stroke-dasharray: 12 8; marker-end: url(#arrow-message); }
    .technical-route { fill: none; stroke: #64748B; stroke-width: 3; stroke-dasharray: 4 6; marker-end: url(#arrow-technical); }
    .compensation { fill: none; stroke: #9A3412; stroke-width: 4; stroke-dasharray: 12 6 3 6; marker-end: url(#arrow-compensation); }
  </style>

  <g data-node-id="comparison-canvas" data-role="canvas" data-node-bounds="0 0 2400 2450"><rect id="canvas" x="0" y="0" width="2400" height="2450" fill="#F8FAFC"/><text class="title essential-role" fill="#0F172A" x="650" y="105">经典 SOA 与微服务订单履约机制对照</text></g>
  <g data-node-id="soa-boundary" data-role="boundary" data-node-bounds="40 200 1120 1860"><rect x="40" y="200" width="1120" height="1860" rx="24" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="4"/><text class="boundary-title" data-header-for="soa-boundary" x="600" y="310">经典 SOA</text></g>
  <g data-node-id="comparison-axis" data-role="comparison-axis" data-node-bounds="1175 200 50 1860"><rect x="1175" y="200" width="50" height="1860" rx="20" fill="#F1F5F9" stroke="#64748B" stroke-width="4"/><text class="node-type" transform="translate(1200 1130) rotate(-90)" x="0" y="0">优化尺度与约束组合不同，不是成熟度阶梯</text></g>
  <g data-node-id="microservices-boundary" data-role="boundary" data-node-bounds="1240 200 1120 1860"><rect x="1240" y="200" width="1120" height="1860" rx="24" fill="#F0FDF4" stroke="#047857" stroke-width="4"/><text class="boundary-title" data-header-for="microservices-boundary" x="1800" y="310">微服务</text></g>
