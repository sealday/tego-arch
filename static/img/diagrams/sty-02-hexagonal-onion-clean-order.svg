<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">提交订单在 Hexagonal、Onion 与 Clean Architecture 中的共同边界</title>
  <desc id="diagram-description">同一提交订单控制流从外部驱动方经过核心拥有的输入端口进入用例，再经核心拥有的库存和仓储接口调用外部机制；实线表示运行时控制流，虚线表示源码依赖指向内侧接口。</desc>
  <defs>
    <marker id="arrow-runtime" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto"><path d="M1 1L13 7L1 13Z" fill="#263238"/></marker>
    <marker id="arrow-dependency" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto"><path d="M2 2L14 8L2 14" fill="none" stroke="#2F6F9F" stroke-width="2.5"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#263238}
      .boundary-title{font-size:24px;font-weight:750;letter-spacing:.5px}
      .node-title{font-size:22.5px;font-weight:720}
      .node-role{font-size:15px;font-weight:650;letter-spacing:.1px}
      .edge-label{font-size:23px;font-weight:700}
      .runtime{fill:none;stroke:#263238;stroke-width:3;marker-end:url(#arrow-runtime)}
      .dependency{fill:none;stroke:#2F6F9F;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow-dependency)}
    </style>
  </defs>
  <path d="M0 0H1200V760H0Z" fill="#F6F1E7"/>
  <text x="600" y="46" text-anchor="middle" class="edge-label">术语映射用于对照，不表示节点完全等价</text>

  <path data-boundary-id="b-driver" data-bounds="30 100 220 520" d="M42 100H238Q250 100 250 112V608Q250 620 238 620H42Q30 620 30 608V112Q30 100 42 100Z" fill="#FBF8F1" stroke="#77716A" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="140" y="142" text-anchor="middle" class="boundary-title">外部驱动方</text>
  <path data-boundary-id="b-core" data-bounds="400 70 550 620" d="M414 70H936Q950 70 950 84V676Q950 690 936 690H414Q400 690 400 676V84Q400 70 414 70Z" fill="#EEF3ED" stroke="#405D6B" stroke-width="3"/>
  <text x="675" y="113" text-anchor="middle" class="boundary-title">应用核心</text>
  <path data-boundary-id="b-mechanism" data-bounds="980 100 190 520" d="M992 100H1158Q1170 100 1170 112V608Q1170 620 1158 620H992Q980 620 980 608V112Q980 100 992 100Z" fill="#FBF8F1" stroke="#77716A" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1075" y="142" text-anchor="middle" class="boundary-title">外部机制</text>

  <path data-edge-id="c1" data-source="n-driver" data-target="n-input-adapter" d="M235 365H259" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>
  <path data-edge-id="c2" data-source="n-input-adapter" data-target="n-input-port" d="M395 315H412V200H429" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>
  <path data-edge-id="c8" data-source="n-input-port" data-target="n-usecase" d="M565 275V354" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>
  <path data-edge-id="c3" data-source="n-usecase" data-target="n-domain" d="M470 485V554" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>
  <path data-edge-id="c4" data-source="n-usecase" data-target="n-inventory-port" d="M700 390H705V215H709" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>
  <path data-edge-id="c5" data-source="n-inventory-port" data-target="n-inventory-adapter" d="M940 230H984" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>
  <path data-edge-id="c6" data-source="n-usecase" data-target="n-order-port" d="M700 450H705V535H709" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>
  <path data-edge-id="c7" data-source="n-order-port" data-target="n-database-adapter" d="M940 500H984" class="runtime" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#arrow-runtime)"/>

  <path data-edge-id="d1" data-source="n-input-adapter" data-target="n-input-port" d="M395 435H415V245H430" class="dependency" fill="none" stroke="#2F6F9F" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-dependency)"/>
  <path data-edge-id="d2" data-source="n-inventory-adapter" data-target="n-inventory-port" d="M985 280H940" class="dependency" fill="none" stroke="#2F6F9F" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-dependency)"/>
  <path data-edge-id="d3" data-source="n-database-adapter" data-target="n-order-port" d="M985 580H940" class="dependency" fill="none" stroke="#2F6F9F" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-dependency)"/>

  <g data-node-id="n-driver" data-node-bounds="45 300 190 130" data-bounds="45 300 190 130" data-label="HTTP / CLI / 自动化测试">
    <path d="M57 300H223Q235 300 235 312V418Q235 430 223 430H57Q45 430 45 418V312Q45 300 57 300Z" fill="#ECE8E1" stroke="#77716A" stroke-width="2"/>
    <text x="140" y="350" text-anchor="middle" class="node-title">HTTP / CLI /<tspan x="140" dy="30"> 自动化测试</tspan></text>
  </g>
  <g data-node-id="n-input-adapter" data-node-bounds="260 265 135 210" data-bounds="260 265 135 210" data-label="输入适配器" data-role-label="Driving Adapter / UI Edge / Controller">
    <path d="M272 265H383Q395 265 395 277V463Q395 475 383 475H272Q260 475 260 463V277Q260 265 272 265Z" fill="#DCE7EA" stroke="#405D6B" stroke-width="2"/>
    <text x="327.5" y="314" text-anchor="middle" class="node-title">输入<tspan x="327.5" dy="28">适配器</tspan></text>
    <text x="327.5" y="375.2" text-anchor="middle" class="node-role" fill="#405D6B">Driving<tspan x="327.5" dy="18"> Adapter /</tspan><tspan x="327.5" dy="18"> UI Edge /</tspan><tspan x="327.5" dy="18"> Controller</tspan></text>
  </g>
  <g data-node-id="n-input-port" data-node-bounds="430 130 270 145" data-bounds="430 130 270 145">
    <path d="M442 130H688Q700 130 700 142V263Q700 275 688 275H442Q430 275 430 263V142Q430 130 442 130Z" fill="#FFF7DA" stroke="#8B7855" stroke-width="2"/>
    <text x="565" y="175" text-anchor="middle" class="node-title">输入端口</text>
    <text x="565" y="211" text-anchor="middle" class="node-role" fill="#6A5A3E">Driving Port /<tspan x="565" dy="18"> Application Interface /</tspan><tspan x="565" dy="18"> Input Boundary</tspan></text>
  </g>
  <g data-node-id="n-usecase" data-node-bounds="430 355 270 130" data-bounds="430 355 270 130">
    <path d="M442 355H688Q700 355 700 367V473Q700 485 688 485H442Q430 485 430 473V367Q430 355 442 355Z" fill="#405D6B" stroke="#304854" stroke-width="2"/>
    <text x="565" y="400" text-anchor="middle" class="node-title" style="fill:#FFFFFF">提交订单用例</text>
    <text x="565" y="436" text-anchor="middle" class="node-role" style="fill:#DCE7EA">Use Case / Application<tspan x="565" dy="18"> Service / Interactor</tspan></text>
  </g>
  <g data-node-id="n-domain" data-node-bounds="430 555 270 120" data-bounds="430 555 270 120">
    <path d="M442 555H688Q700 555 700 567V663Q700 675 688 675H442Q430 675 430 663V567Q430 555 442 555Z" fill="#D9E5DA" stroke="#64806B" stroke-width="2"/>
    <text x="565" y="600" text-anchor="middle" class="node-title">订单领域规则</text>
    <text x="565" y="633" text-anchor="middle" class="node-role" fill="#405D6B">Domain Model /<tspan x="565" dy="18"> Entity Policy</tspan></text>
  </g>
  <g data-node-id="n-inventory-port" data-node-bounds="710 135 230 160" data-bounds="710 135 230 160" data-role-label="Driven Port / Core Interface / Output Gateway">
    <path d="M722 135H928Q940 135 940 147V283Q940 295 928 295H722Q710 295 710 283V147Q710 135 722 135Z" fill="#FFF7DA" stroke="#8B7855" stroke-width="2"/>
    <text x="825" y="184" text-anchor="middle" class="node-title">库存端口</text>
    <text x="825" y="217.2" text-anchor="middle" class="node-role" fill="#6A5A3E">Driven Port /<tspan x="825" dy="18"> Core Interface /</tspan><tspan x="825" dy="18"> Output Gateway</tspan></text>
  </g>
  <g data-node-id="n-order-port" data-node-bounds="710 455 230 160" data-bounds="710 455 230 160" data-role-label="Driven Port / Core Interface / Output Gateway">
    <path d="M722 455H928Q940 455 940 467V603Q940 615 928 615H722Q710 615 710 603V467Q710 455 722 455Z" fill="#FFF7DA" stroke="#8B7855" stroke-width="2"/>
    <text x="825" y="504" text-anchor="middle" class="node-title">订单仓储端口</text>
    <text x="825" y="537.2" text-anchor="middle" class="node-role" fill="#6A5A3E">Driven Port /<tspan x="825" dy="18"> Core Interface /</tspan><tspan x="825" dy="18"> Output Gateway</tspan></text>
  </g>
  <g data-node-id="n-inventory-adapter" data-node-bounds="985 155 180 210" data-bounds="985 155 180 210" data-label="库存服务适配器" data-role-label="Driven Adapter / Infrastructure / Interface Adapter">
    <path d="M997 155H1153Q1165 155 1165 167V353Q1165 365 1153 365H997Q985 365 985 353V167Q985 155 997 155Z" fill="#ECE8E1" stroke="#77716A" stroke-width="2"/>
    <text x="1075" y="204" text-anchor="middle" class="node-title">库存服务<tspan x="1075" dy="28">适配器</tspan></text>
    <text x="1075" y="265.2" text-anchor="middle" class="node-role" fill="#55514B">Driven<tspan x="1075" dy="16"> Adapter /</tspan><tspan x="1075" dy="16"> Infrastructure /</tspan><tspan x="1075" dy="16"> Interface</tspan><tspan x="1075" dy="16"> Adapter</tspan></text>
  </g>
  <g data-node-id="n-database-adapter" data-node-bounds="985 400 180 210" data-bounds="985 400 180 210" data-label="数据库适配器" data-role-label="Driven Adapter / Infrastructure / Interface Adapter">
    <path d="M997 400H1153Q1165 400 1165 412V598Q1165 610 1153 610H997Q985 610 985 598V412Q985 400 997 400Z" fill="#ECE8E1" stroke="#77716A" stroke-width="2"/>
    <text x="1075" y="449" text-anchor="middle" class="node-title">数据库<tspan x="1075" dy="28">适配器</tspan></text>
    <text x="1075" y="510.2" text-anchor="middle" class="node-role" fill="#55514B">Driven<tspan x="1075" dy="16"> Adapter /</tspan><tspan x="1075" dy="16"> Infrastructure /</tspan><tspan x="1075" dy="16"> Interface</tspan><tspan x="1075" dy="16"> Adapter</tspan></text>
  </g>

  <text x="180" y="265" text-anchor="middle" class="edge-label" data-edge-id="c1" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">提交</text>
  <text x="325" y="230" text-anchor="middle" class="edge-label" data-edge-id="c2" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">调用输入边界</text>
  <text x="640" y="320" text-anchor="middle" class="edge-label" data-edge-id="c8" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">进入用例</text>
  <text x="620" y="529" text-anchor="middle" class="edge-label" data-edge-id="c3" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">执行业务判断</text>
  <text x="790" y="340" text-anchor="middle" class="edge-label" data-edge-id="c4" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">查询库存</text>
  <text x="850" y="390" text-anchor="middle" class="edge-label" data-edge-id="c5" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">调用外部能力</text>
  <text x="820" y="660" text-anchor="middle" class="edge-label" data-edge-id="c6" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">保存订单</text>
  <text x="850" y="430" text-anchor="middle" class="edge-label" data-edge-id="c7" data-stroke-clearance-css="8" data-arrow-clearance-css="16" data-node-clearance-css="12">调用持久化</text>

  <path d="M70 721H220" class="runtime"/>
  <text x="250" y="729" class="edge-label">运行时控制流</text>
  <path d="M470 721H620" class="dependency"/>
  <text x="650" y="729" class="edge-label" fill="#2F6F9F">源码依赖指向内侧接口</text>
</svg>
