<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 3900" role="img" aria-labelledby="sty10-title sty10-desc">
  <title id="sty10-title">订单平台双平面微内核与进程外插件</title>
  <desc id="sty10-desc">控制面验证、授权、激活和回滚插件，执行面由订单微内核宿主通过受控网关调用进程外插件；进程外隔离不是完整安全沙箱，关键请求失败关闭，通知失败降级并进入有界异步补偿。</desc>
  <defs>
    <marker id="arrow-control" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="24" markerHeight="24" refX="12" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#475569"/></marker>
    <marker id="arrow-invocation" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="24" markerHeight="24" refX="12" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0F766E"/></marker>
    <marker id="arrow-authority" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="24" markerHeight="24" refX="12" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#7C3AED"/></marker>
    <marker id="arrow-recovery" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="24" markerHeight="24" refX="12" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0369A1"/></marker>
  </defs>

  <g data-region-id="control-plane"><rect x="60" y="160" width="2280" height="800" rx="28" ry="28" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/><text data-region-label-for="control-plane" x="120" y="275" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#334155">控制面：身份、权限与激活</text></g>
  <g data-region-id="execution-plane"><rect x="60" y="1100" width="1500" height="1860" rx="28" ry="28" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="3"/><text data-region-label-for="execution-plane" x="180" y="1200" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0F766E">执行面：宿主保留业务决策权</text></g>
  <g data-region-id="plugin-processes"><rect x="1640" y="1100" width="700" height="1860" rx="28" ry="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/><text data-region-label-for="plugin-processes" x="1700" y="1195" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#9A3412">进程外插件：单一批准能力</text></g>
