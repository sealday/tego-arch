  <g data-node-id="node-supply-chain-verifier"><rect x="690" y="420" width="450" height="260" rx="24" ry="24" fill="#FFFFFF" stroke="#475569" stroke-width="3"/><text data-header-for="node-supply-chain-verifier" x="915" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#111827">供应链验证器</text><text data-type-for="node-supply-chain-verifier" x="915" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" fill="#475569">来源与签名</text></g>
