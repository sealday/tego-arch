  <g data-note-id="note-security-boundary" data-note-region="control-plane"><rect x="120" y="730" width="1500" height="180" rx="18" ry="18" fill="#EEF2FF" stroke="#6366F1" stroke-width="3"/><text data-note-line-for="note-security-boundary-line-1" x="180" y="805" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#3730A3">进程外隔离 ≠ 完整安全沙箱</text><text data-note-line-for="note-security-boundary-line-2" x="180" y="858" font-family="Arial, sans-serif" font-size="36" fill="#4338CA">仍需约束身份、网络、文件、凭证与资源</text></g>
