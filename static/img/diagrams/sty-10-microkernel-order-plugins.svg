  <g data-node-id="node-release-controller"><rect x="1830" y="420" width="450" height="260" rx="24" ry="24" fill="#FFFFFF" stroke="#475569" stroke-width="3"/><text data-header-for="node-release-controller" x="2055" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#111827">发布控制器</text><text data-type-for="node-release-controller" x="2055" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" fill="#475569">生命周期</text></g>
  <g data-node-id="node-order-microkernel-host"><rect x="160" y="1450" width="520" height="260" rx="24" ry="24" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/><text data-header-for="node-order-microkernel-host" x="420" y="1535" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#111827">订单微内核宿主</text><text data-type-for="node-order-microkernel-host" x="420" y="1655" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" fill="#0F766E">业务状态所有者</text></g>
  <g data-node-id="node-controlled-invocation-gateway"><rect x="900" y="1450" width="520" height="260" rx="24" ry="24" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/><text data-header-for="node-controlled-invocation-gateway" x="1160" y="1535" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="700" fill="#111827">受控调用网关</text><text data-type-for="node-controlled-invocation-gateway" x="1160" y="1655" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" fill="#0F766E">调用门禁</text></g>
