    <text x="1520" y="786" text-anchor="middle" class="node-title" data-text-role="title">Inventory Adapter</text><text x="1520" y="836" text-anchor="middle" class="node-type" data-text-role="type">外部机制 / Adapter</text>
  </g>
  <g data-node-id="order-persistence-adapter" data-node-bounds="1320 970 400 170" data-type-label="持久化机制 / Adapter">
