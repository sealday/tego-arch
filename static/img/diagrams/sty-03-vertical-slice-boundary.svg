    <text x="1060" y="1176" text-anchor="middle" class="node-title" data-text-role="title">Inventory Adapter</text>
    <text x="1060" y="1226" text-anchor="middle" class="node-type">外部机制 / Adapter</text>
  </g>

  <text x="550" y="334" text-anchor="start" class="edge-label" data-edge-id="layered-request">运行时控制流</text>
  <text x="550" y="554" text-anchor="start" class="edge-label" data-edge-id="layered-controller-service">运行时控制流</text>
  <text x="550" y="774" text-anchor="start" class="edge-label" data-edge-id="layered-service-repository">运行时控制流</text>
  <text x="550" y="994" text-anchor="start" class="edge-label" data-edge-id="layered-repository-database">运行时控制流</text>
  <text x="1520" y="394" text-anchor="start" class="edge-label" data-edge-id="slice-request-handler">运行时控制流</text>
  <text x="1520" y="620" text-anchor="start" class="edge-label" data-edge-id="slice-handler-rules">运行时控制流</text>
  <text x="830" y="865" text-anchor="end" class="edge-label" data-edge-id="slice-rules-inventory">运行时控制流</text>
  <text x="830" y="915" text-anchor="end" class="edge-label" data-edge-id="slice-rules-store">运行时控制流</text>
  <text x="830" y="965" text-anchor="end" class="edge-label" data-edge-id="slice-rules-response">运行时控制流</text>
  <text x="700" y="770" text-anchor="middle" class="edge-label" fill="#2F6F9F" transform="rotate(-90 700 770)" data-edge-id="layered-repository-service-dependency">源码依赖</text>
  <text x="770" y="1195" text-anchor="end" class="edge-label" fill="#2F6F9F" data-edge-id="inventory-adapter-port-dependency">源码依赖</text>

