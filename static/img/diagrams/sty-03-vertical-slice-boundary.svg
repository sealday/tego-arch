    <text x="1510" y="496" text-anchor="middle" class="node-title" data-text-role="title">Order Rules</text><text x="1510" y="546" text-anchor="middle" class="node-type" data-text-role="type">领域规则 / Policy</text>
  </g>
  <g data-node-id="inventory-adapter" data-node-bounds="1320 720 400 170" data-type-label="外部机制 / Adapter">
