    <text x="320" y="906" text-anchor="middle" class="node-type">共享数据访问 / Infrastructure</text>
  </g>
  <g data-node-id="layered-database" data-node-bounds="120 1010 400 170">
    <path d="M120 1040Q120 1010 320 1010T520 1040V1150Q520 1180 320 1180T120 1150Z" fill="#ECE8E1" stroke="#77716A" stroke-width="3"/>
    <path d="M120 1040Q120 1070 320 1070T520 1040" fill="none" stroke="#77716A" stroke-width="3"/>
    <text x="320" y="1090" text-anchor="middle" class="node-title" data-text-role="title">数据库</text>
    <text x="320" y="1140" text-anchor="middle" class="node-type">Shared Database</text>
  </g>

  <g data-node-id="slice-http" data-node-bounds="1070 190 410 170">
    <path d="M1088 190H1462Q1480 190 1480 208V342Q1480 360 1462 360H1088Q1070 360 1070 342V208Q1070 190 1088 190Z" fill="#ECE8E1" stroke="#77716A" stroke-width="3"/>
    <text x="1275" y="256" text-anchor="middle" class="node-title" data-text-role="title">HTTP 请求</text>
    <text x="1275" y="306" text-anchor="middle" class="node-type">入口 / Request</text>
  </g>
  <g data-node-id="submit-order-handler" data-node-bounds="1069 400 412 170">
    <path d="M1087 400H1463Q1481 400 1481 418V552Q1481 570 1463 570H1087Q1069 570 1069 552V418Q1069 400 1087 400Z" fill="#405D6B" stroke="#304854" stroke-width="3"/>
    <text x="1275" y="466" text-anchor="middle" class="node-title" style="fill:#FFFFFF" data-text-role="title">SubmitOrder Handler</text>
    <text x="1275" y="516" text-anchor="middle" class="node-type" style="fill:#DCE7EA">切片入口 / Use Case Handler</text>
  </g>
  <g data-node-id="order-rules" data-node-bounds="1075 650 400 170">
    <path d="M1093 650H1457Q1475 650 1475 668V802Q1475 820 1457 820H1093Q1075 820 1075 802V668Q1075 650 1093 650Z" fill="#D9E5DA" stroke="#64806B" stroke-width="3"/>
