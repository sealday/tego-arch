<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1480" role="img" aria-labelledby="sty03-title sty03-description">
  <title id="sty03-title">分层架构与 SubmitOrder 垂直切片的单体边界对比</title>
  <desc id="sty03-description">两列对比同一单体部署边界内的分层控制流与 SubmitOrder 垂直切片。实线表示运行时控制流，虚线表示源码依赖；共享领域不变量跨越切片内部的规则与端口，但切片不等于独立部署单元。</desc>
  <defs>
    <marker id="sty03-runtime-arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" viewBox="0 0 28 28" refX="25" refY="14" orient="auto"><path d="M2 2L26 14L2 26Z" fill="#263238"/></marker>
    <marker id="sty03-dependency-arrow" markerUnits="userSpaceOnUse" markerWidth="32" markerHeight="32" viewBox="0 0 32 32" refX="28" refY="16" orient="auto"><path d="M4 4L28 16L4 28" fill="none" stroke="#2F6F9F" stroke-width="4"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#263238}
      .boundary-title{font-size:34px;font-weight:760;letter-spacing:.5px}
      .node-title{font-size:34px;font-weight:720}
      .node-type{font-size:23px;font-weight:650;letter-spacing:.2px}
      .edge-label{font-size:34px;font-weight:700}
      .runtime{fill:none;stroke:#263238;stroke-width:4;marker-end:url(#sty03-runtime-arrow)}
      .dependency{fill:none;stroke:#2F6F9F;stroke-width:4;stroke-dasharray:14 11;marker-end:url(#sty03-dependency-arrow)}
    </style>
  </defs>
  <path d="M0 0H1800V1480H0Z" fill="#F7F3EA"/>

  <g data-node-id="deployment-boundary" data-node-bounds="20 20 1760 1410">
    <path d="M42 20H1758Q1780 20 1780 42V1408Q1780 1430 1758 1430H42Q20 1430 20 1408V42Q20 20 42 20Z" fill="#F7F3EA" stroke="#263238" stroke-width="4"/>
    <text x="900" y="68" text-anchor="middle" class="boundary-title" data-text-role="title">单体部署边界</text>
  </g>
  <g data-node-id="layered-boundary" data-node-bounds="60 80 720 1240">
    <path d="M78 80H762Q780 80 780 98V1302Q780 1320 762 1320H78Q60 1320 60 1302V98Q60 80 78 80Z" fill="#FBF8F1" stroke="#77716A" stroke-width="3"/>
    <text x="420" y="128" text-anchor="middle" class="boundary-title" data-text-role="title">分层架构</text>
  </g>
  <g data-node-id="vertical-slice-boundary" data-node-bounds="810 80 950 1240">
    <path d="M828 80H1742Q1760 80 1760 98V1302Q1760 1320 1742 1320H828Q810 1320 810 1302V98Q810 80 828 80Z" fill="#EEF3ED" stroke="#405D6B" stroke-width="3"/>
    <text x="1285" y="128" text-anchor="middle" class="boundary-title" data-text-role="title">垂直切片</text>
  </g>
  <g data-node-id="submit-order-boundary" data-node-bounds="840 150 910 1140">
    <path d="M858 150H1732Q1750 150 1750 168V1272Q1750 1290 1732 1290H858Q840 1290 840 1272V168Q840 150 858 150Z" fill="none" stroke="#8B7855" stroke-width="3" stroke-dasharray="14 11"/>
    <text x="1295" y="198" text-anchor="middle" class="boundary-title" data-text-role="title">SubmitOrder</text>
  </g>
  <g data-node-id="shared-domain-invariants" data-node-bounds="865 585 860 500">
    <path d="M883 585H1707Q1725 585 1725 603V1067Q1725 1085 1707 1085H883Q865 1085 865 1067V603Q865 585 883 585Z" fill="#FFF7DA" fill-opacity=".68" stroke="#8B7855" stroke-width="3" stroke-dasharray="11 9"/>
    <text x="1295" y="633" text-anchor="middle" class="boundary-title" data-text-role="title">共享领域不变量</text>
  </g>

  <path data-edge-id="layered-request" data-source="layered-http" data-target="layered-controller" d="M320 300V349" class="runtime"/>
  <path data-edge-id="layered-controller-service" data-source="layered-controller" data-target="layered-service" d="M320 520V569" class="runtime"/>
  <path data-edge-id="layered-service-repository" data-source="layered-service" data-target="layered-repository" d="M320 740V789" class="runtime"/>
  <path data-edge-id="layered-repository-database" data-source="layered-repository" data-target="layered-database" d="M320 960V1009" class="runtime"/>
