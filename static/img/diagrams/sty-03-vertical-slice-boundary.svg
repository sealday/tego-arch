  <path data-edge-id="layered-controller-service" data-source="layered-controller" data-target="layered-service" d="M370 640V739" class="runtime"/>
  <path data-edge-id="layered-service-repository" data-source="layered-service" data-target="layered-repository" d="M370 910V1009" class="runtime"/>
  <path data-edge-id="layered-repository-database" data-source="layered-repository" data-target="shared-database" d="M370 1180V1450H780V1489" class="runtime"/>
