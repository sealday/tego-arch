    <text x="370" y="1076" text-anchor="middle" class="node-title" data-text-role="title">Shared Repository</text><text x="370" y="1126" text-anchor="middle" class="node-type" data-text-role="type">共享数据访问 / Infrastructure</text>
  </g>

  <g data-node-id="slice-http" data-node-bounds="800 230 410 154" data-type-label="入口 / Request">
    <path d="M818 230H1192Q1210 230 1210 248V366Q1210 384 1192 384H818Q800 384 800 366V248Q800 230 818 230Z" fill="#ECE8E1" stroke="#77716A" stroke-width="3"/>
    <text x="1005" y="296" text-anchor="middle" class="node-title" data-text-role="title">HTTP 请求</text><text x="1005" y="346" text-anchor="middle" class="node-type" data-text-role="type">入口 / Request</text>
  </g>
  <g data-node-id="submit-order-handler" data-node-bounds="799 470 412 154" data-type-label="切片入口 / Use Case Handler">
    <path d="M817 470H1193Q1211 470 1211 488V606Q1211 624 1193 624H817Q799 624 799 606V488Q799 470 817 470Z" fill="#405D6B" stroke="#304854" stroke-width="3"/>
    <text x="1005" y="536" text-anchor="middle" class="node-title" style="fill:#FFFFFF" data-text-role="title">SubmitOrder Handler</text><text x="1005" y="586" text-anchor="middle" class="node-type" style="fill:#DCE7EA" data-text-role="type">切片入口 / Use Case Handler</text>
  </g>
