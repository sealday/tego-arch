  </g>
  <g data-node-id="layered-service" data-node-bounds="170 740 400 170" data-type-label="应用层 / Shared Service">
    <path d="M188 740H552Q570 740 570 758V892Q570 910 552 910H188Q170 910 170 892V758Q170 740 188 740Z" fill="#DCE7EA" stroke="#405D6B" stroke-width="3"/>
    <text x="370" y="806" text-anchor="middle" class="node-title" data-text-role="title">Application Service</text><text x="370" y="856" text-anchor="middle" class="node-type" data-text-role="type">应用层 / Shared Service</text>
  </g>
  <g data-node-id="layered-repository" data-node-bounds="170 1010 400 170" data-type-label="共享数据访问 / Infrastructure">
