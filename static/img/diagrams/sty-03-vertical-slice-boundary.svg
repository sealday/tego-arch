  <path data-edge-id="slice-handler-store" data-source="submit-order-handler" data-target="order-store" d="M1211 547H1260V950H944V969" class="runtime"/>
  <path data-edge-id="slice-handler-response" data-source="submit-order-handler" data-target="response-mapper" d="M1211 547H1290V1170H1005V1199" class="runtime"/>
  <path data-edge-id="inventory-port-adapter" data-source="inventory-port" data-target="inventory-adapter" d="M1210 805H1319" class="runtime"/>
  <path data-edge-id="order-store-persistence-adapter" data-source="order-store" data-target="order-persistence-adapter" d="M1210 1047H1260V1055H1319" class="runtime"/>
  <path data-edge-id="order-persistence-database" data-source="order-persistence-adapter" data-target="shared-database" d="M1520 1140V1450H1020V1489" class="runtime"/>
  <path data-edge-id="layered-repository-service-dependency" data-source="layered-repository" data-target="layered-service" d="M570 1095H680V825H571" class="dependency"/>
  <path data-edge-id="inventory-adapter-port-dependency" data-source="inventory-adapter" data-target="inventory-port" d="M1520 720V670H1067V719" class="dependency"/>
  <path data-edge-id="order-persistence-adapter-store-dependency" data-source="order-persistence-adapter" data-target="order-store" d="M1520 970V920H1067V969" class="dependency"/>

