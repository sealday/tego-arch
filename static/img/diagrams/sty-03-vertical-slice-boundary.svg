<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1950" role="img" aria-labelledby="sty03-title sty03-description">
  <title id="sty03-title">分层架构与 SubmitOrder 垂直切片的单体边界对比</title>
  <desc id="sty03-description">两列对比同一单体部署边界内的分层控制流与 SubmitOrder 垂直切片。SubmitOrder Handler 编排领域规则、端口与响应映射，端口在运行时调用外部适配器；虚线表示适配器对端口的源码依赖，两侧运行时路径写入同一个共享数据库。</desc>
  <defs>
    <marker id="sty03-runtime-arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" viewBox="0 0 28 28" refX="25" refY="14" orient="auto"><path d="M2 2L26 14L2 26Z" fill="#263238"/></marker>
    <marker id="sty03-dependency-arrow" markerUnits="userSpaceOnUse" markerWidth="32" markerHeight="32" viewBox="0 0 32 32" refX="28" refY="16" orient="auto"><path d="M4 4L28 16L4 28" fill="none" stroke="#2F6F9F" stroke-width="4"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#263238}
      .boundary-title{font-size:34px;font-weight:760;letter-spacing:.5px}
      .node-title{font-size:34px;font-weight:720}
      .node-type{font-size:23px;font-weight:650;letter-spacing:.2px}
      .edge-label{font-size:34px;font-weight:700}
      .runtime{fill:none;stroke:#263238;stroke-width:4;marker-end:url(#sty03-runtime-arrow)}
      .dependency{fill:none;stroke:#2F6F9F;stroke-width:4;stroke-dasharray:14 11;marker-end:url(#sty03-dependency-arrow)}
    </style>
  </defs>
  <path d="M0 0H1800V1950H0Z" fill="#F7F3EA"/>

  <g data-node-id="deployment-boundary" data-node-bounds="20 20 1760 1900" data-type-label="">
    <path d="M42 20H1758Q1780 20 1780 42V1898Q1780 1920 1758 1920H42Q20 1920 20 1898V42Q20 20 42 20Z" fill="#F7F3EA" stroke="#263238" stroke-width="4"/>
    <text x="900" y="68" text-anchor="middle" class="boundary-title" data-text-role="title">单体部署边界</text>
  </g>
  <g data-node-id="layered-boundary" data-node-bounds="60 80 650 1320" data-type-label="">
    <path d="M78 80H692Q710 80 710 98V1382Q710 1400 692 1400H78Q60 1400 60 1382V98Q60 80 78 80Z" fill="#FBF8F1" stroke="#77716A" stroke-width="3"/>
    <text x="385" y="128" text-anchor="middle" class="boundary-title" data-text-role="title">分层架构</text>
  </g>
  <g data-node-id="vertical-slice-boundary" data-node-bounds="740 80 1020 1340" data-type-label="">
    <path d="M758 80H1742Q1760 80 1760 98V1402Q1760 1420 1742 1420H758Q740 1420 740 1402V98Q740 80 758 80Z" fill="#EEF3ED" stroke="#405D6B" stroke-width="3"/>
    <text x="1250" y="128" text-anchor="middle" class="boundary-title" data-text-role="title">垂直切片</text>
  </g>
  <g data-node-id="submit-order-boundary" data-node-bounds="770 160 470 1230" data-type-label="">
    <path d="M788 160H1222Q1240 160 1240 178V1372Q1240 1390 1222 1390H788Q770 1390 770 1372V178Q770 160 788 160Z" fill="none" stroke="#8B7855" stroke-width="3" stroke-dasharray="14 11"/>
    <text x="1005" y="208" text-anchor="middle" class="boundary-title" data-text-role="title">SubmitOrder</text>
  </g>
  <g data-node-id="shared-domain-invariants" data-node-bounds="1300 350 420 274" data-type-label="">
    <path d="M1318 350H1702Q1720 350 1720 368V606Q1720 624 1702 624H1318Q1300 624 1300 606V368Q1300 350 1318 350Z" fill="#FFF7DA" fill-opacity=".68" stroke="#8B7855" stroke-width="3" stroke-dasharray="11 9"/>
    <text x="1510" y="400" text-anchor="middle" class="boundary-title" data-text-role="title">共享领域不变量</text>
  </g>

