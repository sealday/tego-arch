<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1950" role="img" aria-labelledby="sty03-title sty03-description">
  <title id="sty03-title">分层架构与 SubmitOrder 垂直切片的单体边界对比</title>
  <desc id="sty03-description">两列对比同一单体部署边界内的分层控制流与 SubmitOrder 垂直切片。实线表示运行时控制流，虚线表示源码依赖；共享领域不变量保护规则与端口，但切片不等于独立部署单元。</desc>
  <defs>
    <marker id="sty03-runtime-arrow" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" viewBox="0 0 28 28" refX="25" refY="14" orient="auto"><path d="M2 2L26 14L2 26Z" fill="#263238"/></marker>
    <marker id="sty03-dependency-arrow" markerUnits="userSpaceOnUse" markerWidth="32" markerHeight="32" viewBox="0 0 32 32" refX="28" refY="16" orient="auto"><path d="M4 4L28 16L4 28" fill="none" stroke="#2F6F9F" stroke-width="4"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;fill:#263238}
      .boundary-title{font-size:34px;font-weight:760;letter-spacing:.5px}
      .node-title{font-size:34px;font-weight:720}
      .node-type{font-size:23px;font-weight:650;letter-spacing:.2px}
      .edge-label{font-size:34px;font-weight:700}
      .runtime{fill:none;stroke:#263238;stroke-width:4;marker-end:url(#sty03-runtime-arrow)}
      .dependency{fill:none;stroke:#2F6F9F;stroke-width:4;stroke-dasharray:14 11;marker-end:url(#sty03-dependency-arrow)}
    </style>
  </defs>
  <path d="M0 0H1800V1950H0Z" fill="#F7F3EA"/>

  <g data-node-id="deployment-boundary" data-node-bounds="20 20 1760 1900" data-type-label="">
    <path d="M42 20H1758Q1780 20 1780 42V1898Q1780 1920 1758 1920H42Q20 1920 20 1898V42Q20 20 42 20Z" fill="#F7F3EA" stroke="#263238" stroke-width="4"/>
    <text x="900" y="68" text-anchor="middle" class="boundary-title" data-text-role="title">单体部署边界</text>
  </g>
  <g data-node-id="layered-boundary" data-node-bounds="60 80 720 1660" data-type-label="">
    <path d="M78 80H762Q780 80 780 98V1722Q780 1740 762 1740H78Q60 1740 60 1722V98Q60 80 78 80Z" fill="#FBF8F1" stroke="#77716A" stroke-width="3"/>
    <text x="420" y="128" text-anchor="middle" class="boundary-title" data-text-role="title">分层架构</text>
  </g>
  <g data-node-id="vertical-slice-boundary" data-node-bounds="810 80 950 1660" data-type-label="">
    <path d="M828 80H1742Q1760 80 1760 98V1722Q1760 1740 1742 1740H828Q810 1740 810 1722V98Q810 80 828 80Z" fill="#EEF3ED" stroke="#405D6B" stroke-width="3"/>
    <text x="1285" y="128" text-anchor="middle" class="boundary-title" data-text-role="title">垂直切片</text>
  </g>
  <g data-node-id="submit-order-boundary" data-node-bounds="840 170 910 1540" data-type-label="">
    <path d="M858 170H1732Q1750 170 1750 188V1692Q1750 1710 1732 1710H858Q840 1710 840 1692V188Q840 170 858 170Z" fill="none" stroke="#8B7855" stroke-width="3" stroke-dasharray="14 11"/>
    <text x="1295" y="218" text-anchor="middle" class="boundary-title" data-text-role="title">SubmitOrder</text>
  </g>
  <g data-node-id="shared-domain-invariants" data-node-bounds="865 740 860 940" data-type-label="">
    <path d="M883 740H1707Q1725 740 1725 758V1662Q1725 1680 1707 1680H883Q865 1680 865 1662V758Q865 740 883 740Z" fill="#FFF7DA" fill-opacity=".68" stroke="#8B7855" stroke-width="3" stroke-dasharray="11 9"/>
    <text x="1295" y="788" text-anchor="middle" class="boundary-title" data-text-role="title">共享领域不变量</text>
  </g>

  <path data-edge-id="layered-request" data-source="layered-http" data-target="layered-controller" d="M320 370V469" class="runtime"/>
  <path data-edge-id="layered-controller-service" data-source="layered-controller" data-target="layered-service" d="M320 640V739" class="runtime"/>
  <path data-edge-id="layered-service-repository" data-source="layered-service" data-target="layered-repository" d="M320 910V1009" class="runtime"/>
  <path data-edge-id="layered-repository-database" data-source="layered-repository" data-target="layered-database" d="M320 1180V1279" class="runtime"/>
  <path data-edge-id="slice-request-handler" data-source="slice-http" data-target="submit-order-handler" d="M1275 440V539" class="runtime"/>
  <path data-edge-id="slice-handler-rules" data-source="submit-order-handler" data-target="order-rules" d="M1275 710V730H1600V818H1275V829" class="runtime"/>
  <path data-edge-id="slice-rules-inventory" data-source="order-rules" data-target="inventory-port" d="M1175 1000V1095H1045V1159" class="runtime"/>
  <path data-edge-id="slice-rules-store" data-source="order-rules" data-target="order-store" d="M1375 1000V1095H1520V1159" class="runtime"/>
  <path data-edge-id="slice-rules-response" data-source="order-rules" data-target="response-mapper" d="M1375 1000V1100H1700V1425H1490V1469" class="runtime"/>
  <path data-edge-id="layered-repository-service-dependency" data-source="layered-repository" data-target="layered-service" d="M520 1095H680V825H521" class="dependency"/>
  <path data-edge-id="inventory-adapter-port-dependency" data-source="inventory-adapter" data-target="inventory-port" d="M1060 1470V1390H1045V1331" class="dependency"/>

  <g data-node-id="layered-http" data-node-bounds="120 200 400 170" data-type-label="入口 / Request">
    <path d="M138 200H502Q520 200 520 218V352Q520 370 502 370H138Q120 370 120 352V218Q120 200 138 200Z" fill="#ECE8E1" stroke="#77716A" stroke-width="3"/>
    <text x="320" y="266" text-anchor="middle" class="node-title" data-text-role="title">HTTP 请求</text>
    <text x="320" y="316" text-anchor="middle" class="node-type" data-text-role="type">入口 / Request</text>
  </g>
  <g data-node-id="layered-controller" data-node-bounds="120 470 400 170" data-type-label="接口层 / Web">
    <path d="M138 470H502Q520 470 520 488V622Q520 640 502 640H138Q120 640 120 622V488Q120 470 138 470Z" fill="#DCE7EA" stroke="#405D6B" stroke-width="3"/>
    <text x="320" y="536" text-anchor="middle" class="node-title" data-text-role="title">Controller</text>
    <text x="320" y="586" text-anchor="middle" class="node-type" data-text-role="type">接口层 / Web</text>
  </g>
  <g data-node-id="layered-service" data-node-bounds="120 740 400 170" data-type-label="应用层 / Shared Service">
    <path d="M138 740H502Q520 740 520 758V892Q520 910 502 910H138Q120 910 120 892V758Q120 740 138 740Z" fill="#DCE7EA" stroke="#405D6B" stroke-width="3"/>
    <text x="320" y="806" text-anchor="middle" class="node-title" data-text-role="title">Application Service</text>
    <text x="320" y="856" text-anchor="middle" class="node-type" data-text-role="type">应用层 / Shared Service</text>
  </g>
  <g data-node-id="layered-repository" data-node-bounds="120 1010 400 170" data-type-label="共享数据访问 / Infrastructure">
    <path d="M138 1010H502Q520 1010 520 1028V1162Q520 1180 502 1180H138Q120 1180 120 1162V1028Q120 1010 138 1010Z" fill="#FFF7DA" stroke="#8B7855" stroke-width="3"/>
    <text x="320" y="1076" text-anchor="middle" class="node-title" data-text-role="title">Shared Repository</text>
    <text x="320" y="1126" text-anchor="middle" class="node-type" data-text-role="type">共享数据访问 / Infrastructure</text>
  </g>
  <g data-node-id="layered-database" data-node-bounds="120 1280 400 170" data-type-label="Shared Database">
    <path d="M120 1310Q120 1280 320 1280T520 1310V1420Q520 1450 320 1450T120 1420Z" fill="#ECE8E1" stroke="#77716A" stroke-width="3"/>
    <path d="M120 1310Q120 1340 320 1340T520 1310" fill="none" stroke="#77716A" stroke-width="3"/>
    <text x="320" y="1360" text-anchor="middle" class="node-title" data-text-role="title">数据库</text>
    <text x="320" y="1410" text-anchor="middle" class="node-type" data-text-role="type">Shared Database</text>
  </g>

  <g data-node-id="slice-http" data-node-bounds="1070 270 410 170" data-type-label="入口 / Request">
    <path d="M1088 270H1462Q1480 270 1480 288V422Q1480 440 1462 440H1088Q1070 440 1070 422V288Q1070 270 1088 270Z" fill="#ECE8E1" stroke="#77716A" stroke-width="3"/>
    <text x="1275" y="336" text-anchor="middle" class="node-title" data-text-role="title">HTTP 请求</text>
    <text x="1275" y="386" text-anchor="middle" class="node-type" data-text-role="type">入口 / Request</text>
  </g>
  <g data-node-id="submit-order-handler" data-node-bounds="1069 540 412 170" data-type-label="切片入口 / Use Case Handler">
    <path d="M1087 540H1463Q1481 540 1481 558V692Q1481 710 1463 710H1087Q1069 710 1069 692V558Q1069 540 1087 540Z" fill="#405D6B" stroke="#304854" stroke-width="3"/>
    <text x="1275" y="606" text-anchor="middle" class="node-title" style="fill:#FFFFFF" data-text-role="title">SubmitOrder Handler</text>
    <text x="1275" y="656" text-anchor="middle" class="node-type" style="fill:#DCE7EA" data-text-role="type">切片入口 / Use Case Handler</text>
  </g>
  <g data-node-id="order-rules" data-node-bounds="1075 830 400 170" data-type-label="领域规则 / Policy">
    <path d="M1093 830H1457Q1475 830 1475 848V982Q1475 1000 1457 1000H1093Q1075 1000 1075 982V848Q1075 830 1093 830Z" fill="#D9E5DA" stroke="#64806B" stroke-width="3"/>
    <text x="1275" y="896" text-anchor="middle" class="node-title" data-text-role="title">Order Rules</text>
    <text x="1275" y="946" text-anchor="middle" class="node-type" data-text-role="type">领域规则 / Policy</text>
  </g>
  <g data-node-id="inventory-port" data-node-bounds="885 1160 320 170" data-type-label="Driven Port">
    <path d="M903 1160H1187Q1205 1160 1205 1178V1312Q1205 1330 1187 1330H903Q885 1330 885 1312V1178Q885 1160 903 1160Z" fill="#FFF7DA" stroke="#8B7855" stroke-width="3"/>
