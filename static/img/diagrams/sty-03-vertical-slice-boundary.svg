    <text x="1045" y="1276" text-anchor="middle" class="node-type" data-text-role="type">Driven Port</text>
  </g>
  <g data-node-id="order-store" data-node-bounds="1380 1160 280 170" data-type-label="Persistence Port">
    <path d="M1398 1160H1642Q1660 1160 1660 1178V1312Q1660 1330 1642 1330H1398Q1380 1330 1380 1312V1178Q1380 1160 1398 1160Z" fill="#FFF7DA" stroke="#8B7855" stroke-width="3"/>
    <text x="1520" y="1226" text-anchor="middle" class="node-title" data-text-role="title">Order Store</text>
    <text x="1520" y="1276" text-anchor="middle" class="node-type" data-text-role="type">Persistence Port</text>
  </g>
  <g data-node-id="response-mapper" data-node-bounds="1300 1470 380 170" data-type-label="输出映射 / Presenter">
    <path d="M1318 1470H1662Q1680 1470 1680 1488V1622Q1680 1640 1662 1640H1318Q1300 1640 1300 1622V1488Q1300 1470 1318 1470Z" fill="#DCE7EA" stroke="#405D6B" stroke-width="3"/>
    <text x="1490" y="1536" text-anchor="middle" class="node-title" data-text-role="title">Response Mapper</text>
    <text x="1490" y="1586" text-anchor="middle" class="node-type" data-text-role="type">输出映射 / Presenter</text>
  </g>
  <g data-node-id="inventory-adapter" data-node-bounds="870 1470 380 170" data-type-label="外部机制 / Adapter">
    <path d="M888 1470H1232Q1250 1470 1250 1488V1622Q1250 1640 1232 1640H888Q870 1640 870 1622V1488Q870 1470 888 1470Z" fill="#ECE8E1" stroke="#77716A" stroke-width="3"/>
    <text x="1060" y="1536" text-anchor="middle" class="node-title" data-text-role="title">Inventory Adapter</text>
    <text x="1060" y="1586" text-anchor="middle" class="node-type" data-text-role="type">外部机制 / Adapter</text>
  </g>

  <text x="375" y="433" text-anchor="start" class="edge-label" data-edge-id="layered-request">接收请求</text>
  <text x="375" y="703" text-anchor="start" class="edge-label" data-edge-id="layered-controller-service">调用应用</text>
  <text x="375" y="973" text-anchor="start" class="edge-label" data-edge-id="layered-service-repository">访问仓储</text>
  <text x="375" y="1243" text-anchor="start" class="edge-label" data-edge-id="layered-repository-database">写入数据</text>
  <text x="1330" y="503" text-anchor="start" class="edge-label" data-edge-id="slice-request-handler">进入切片</text>
  <text x="1660" y="765" text-anchor="middle" class="edge-label" transform="rotate(-90 1660 765)" data-edge-id="slice-handler-rules">执行业务规则</text>
  <text x="1265" y="1063" text-anchor="middle" class="edge-label" data-edge-id="slice-rules-inventory">查询库存</text>
  <text x="1615" y="1063" text-anchor="middle" class="edge-label" data-edge-id="slice-rules-store">保存订单</text>
  <text x="1585" y="1393" text-anchor="middle" class="edge-label" data-edge-id="slice-rules-response">映射响应</text>
  <text x="740" y="960" text-anchor="middle" class="edge-label" fill="#2F6F9F" transform="rotate(-90 740 960)" data-edge-id="layered-repository-service-dependency">依赖抽象</text>
  <text x="1095" y="1408" text-anchor="start" class="edge-label" fill="#2F6F9F" data-edge-id="inventory-adapter-port-dependency">实现端口</text>

  <g data-node-id="legend-runtime-line" data-node-bounds="70 1835 110 1" data-type-label="" data-legend-line="runtime"><path d="M70 1835H180" class="runtime"/></g>
  <g data-node-id="legend-dependency-line" data-node-bounds="430 1835 110 1" data-type-label="" data-legend-line="dependency"><path d="M430 1835H540" class="dependency"/></g>
  <g data-node-id="legend-runtime" data-node-bounds="205 1814 250 42" data-type-label=""><text x="205" y="1846" class="edge-label" data-text-role="title">运行时控制流</text></g>
  <g data-node-id="legend-dependency" data-node-bounds="565 1814 190 42" data-type-label=""><text x="565" y="1846" class="edge-label" fill="#2F6F9F" data-text-role="title">源码依赖</text></g>
  <g data-node-id="deployment-note" data-node-bounds="1120 1805 570 52" data-type-label=""><text x="1405" y="1846" text-anchor="middle" class="edge-label" fill="#6A5A3E" data-text-role="title">切片不等于独立部署单元</text></g>
</svg>
